                                                                                                                                                                                                                                                                                                                                                                                                                                                                       
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | AV Sweet House</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#fff0f5,#ffe5ec,#fff8fb);
padding:20px;
}

.login-card{
background:white;
width:100%;
max-width:500px;
padding:40px;
border-radius:30px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.logo{
text-align:center;
font-size:40px;
font-weight:800;
color:#ff4d8d;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:30px;
}

.form-label{
font-weight:600;
margin-bottom:8px;
}

.form-control{
height:55px;
border-radius:15px;
border:2px solid #ffe0ea;
}

.form-control:focus{
border-color:#ff4d8d;
box-shadow:none;
}

.btn-login{
width:100%;
height:55px;
border:none;
border-radius:30px;
background:#ff4d8d;
color:white;
font-size:18px;
font-weight:600;
transition:.3s;
}

.btn-login:hover{
background:#ff2f78;
}

.options{
display:flex;
justify-content:space-between;
align-items:center;
margin:15px 0;
font-size:14px;
}

.options a{
text-decoration:none;
color:#ff4d8d;
font-weight:600;
}

.signup-link{
text-align:center;
margin-top:25px;
color:#666;
}

.signup-link a{
color:#ff4d8d;
font-weight:700;
text-decoration:none;
}

.password-wrapper{
position:relative;
}

.toggle-password{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#888;
}

</style>

</head>
<body>

<div class="login-card">

<div class="logo">
🍰 AV Sweet House
</div>

<p class="subtitle">
Welcome Back! Login to your account
</p>

<form>

<div class="mb-3">
<label class="form-label">Email Address</label>
<input type="email"
id="email"
class="form-control"
placeholder="Enter your email">
</div>


<div class="mb-3">
<label class="form-label">Password</label>

<div class="password-wrapper">

<input type="password"
id="password"
class="form-control"
placeholder="Enter your password">

<span class="toggle-password"
onclick="togglePassword()">
👁️
</span>

</div>
</div>

<div class="options">

<div>
<input type="checkbox">
 Remember Me
</div>

<a href="#">
Forgot Password?
</a>

</div>

<button
type="button"
class="btn-login"
onclick="loginUser()">

Login

</button>

</form>

<div class="signup-link">

Don't have an account?

<a href="signup.html">
Create Account
</a>

</div>

</div>

<script>

function togglePassword(){

let password =
document.getElementById("password");

if(password.type === "password"){

password.type = "text";

}else{

password.type = "password";

}

}

async function loginUser() {

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    try {

        const response = await fetch("http://localhost:5000/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email,
                password
            })

        });

        const data = await response.json();

        if (data.success) {

            alert("✅ Login Successful");

            localStorage.setItem(
                "currentUser",
                JSON.stringify(data.user)
            );

            window.location.href = "http://localhost:5000";

        } else {

            alert(data.message);

        }

    } catch (err) {

        console.log(err);

        alert("Server Error");

    }

}

</script>

</body>
</html>
