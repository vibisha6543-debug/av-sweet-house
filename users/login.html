  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AV Sweet House</title>

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at top left, #ffe5ec 0%, transparent 30%),
                radial-gradient(circle at bottom right, #d6f6ff 0%, transparent 30%),
                #fffaf7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 77, 141, 0.08);
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255, 77, 141, 0.05);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card .logo {
            font-size: 50px;
            text-align: center;
            display: block;
        }

        .login-card h2 {
            color: #ff4d8d;
            font-weight: 800;
            text-align: center;
            margin-bottom: 5px;
            font-size: 28px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #f0e0e0;
            border-radius: 15px;
            font-size: 15px;
            transition: 0.3s;
            background: #faf8f8;
        }

        .form-group input:focus {
            border-color: #ff4d8d;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 77, 141, 0.08);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-options label {
            font-weight: 400;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }

        .form-options label input {
            width: auto;
            margin-right: 6px;
            accent-color: #ff4d8d;
        }

        .form-options .forgot-link {
            color: #ff4d8d;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
        }

        .form-options .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-login {
            background: linear-gradient(135deg, #ff4d8d, #ff758f);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            transition: 0.3s;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(255, 77, 141, 0.25);
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 77, 141, 0.35);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============================================
           DIVIDER
           ============================================ */
        .divider {
            text-align: center;
            margin: 25px 0;
            color: #ccc;
            font-size: 13px;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #eee;
        }

        .divider::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #eee;
        }

        /* ============================================
           SOCIAL BUTTONS - IMPROVED
           ============================================ */
        .social-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 30px;
            background: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
        }

        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .social-btn:active {
            transform: scale(0.98);
        }

        /* ===== GOOGLE BUTTON ===== */
        .social-btn.google {
            border-color: #ddd;
            color: #333;
        }

        .social-btn.google:hover {
            border-color: #ea4335;
            background: #fef8f7;
        }

        .social-btn.google .google-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn.google .google-icon svg {
            width: 20px;
            height: 20px;
        }

        /* ===== FACEBOOK BUTTON ===== */
        .social-btn.facebook {
            border-color: #ddd;
            color: #333;
            background: white;
        }

        .social-btn.facebook:hover {
            border-color: #1877f2;
            background: #f0f4ff;
        }

        .social-btn.facebook .facebook-icon {
            font-size: 22px;
            color: #1877f2;
        }

        /* ============================================
           LINKS
           ============================================ */
        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #ff4d8d;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .links a:hover {
            color: #ff2f78;
            text-decoration: underline;
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            font-weight: 600;
            animation: slideIn 0.5s ease;
            display: none;
            font-size: 14px;
            max-width: 400px;
        }

        .toast.success {
            background: #28a745;
            display: block;
        }

        .toast.error {
            background: #dc3545;
            display: block;
        }

        .toast.info {
            background: #17a2b8;
            display: block;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ============================================
           PASSWORD TOGGLE
           ============================================ */
        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            transition: 0.3s;
        }

        .password-toggle .toggle-icon:hover {
            color: #ff4d8d;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media(max-width: 500px) {
            .login-card {
                padding: 30px 20px;
            }

            .form-options {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }

            .social-btn {
                padding: 12px;
                font-size: 13px;
            }

            .social-btn.google .google-icon svg {
                width: 18px;
                height: 18px;
            }

            .social-btn.facebook .facebook-icon {
                font-size: 20px;
            }

            .toast {
                top: 10px;
                right: 10px;
                left: 10px;
                font-size: 13px;
                padding: 12px 16px;
                max-width: none;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <!-- ===== LOGO ===== -->
        <span class="logo">🍰</span>
        <h2>AV Sweet House</h2>
        <p class="subtitle">Welcome back! Login to your account</p>

        <!-- ===== LOGIN FORM ===== -->
        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();" autocomplete="off">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required autocomplete="off">
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <div class="password-toggle">
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="new-password">
                    <span class="toggle-icon" onclick="togglePassword()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </span>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="rememberMe"> Remember Me
                </label>
                <a href="forgetpassword.html" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" id="loginBtn" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <!-- ===== DIVIDER ===== -->
        <div class="divider">────────── OR ──────────</div>

        <!-- ===== GOOGLE BUTTON ===== -->
        <button class="social-btn google" onclick="handleGoogleLogin()">
            <span class="google-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
            </span>
            Continue with Google
        </button>

        <!-- ===== FACEBOOK BUTTON ===== -->
        <button class="social-btn facebook" onclick="handleFacebookLogin()">
            <span class="facebook-icon"><i class="fab fa-facebook"></i></span>
            Continue with Facebook
        </button>

        <!-- ===== LINKS ===== -->
        <div class="links">
            <span>Don't have an account? <a href="signup.html">Sign Up</a></span>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <script>
        // ============================================
        // TOGGLE PASSWORD
        // ============================================

        function togglePassword() {
            const password = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (password.type === 'password') {
                password.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                password.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ============================================
        // SHOW TOAST
        // ============================================

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3500);
        }

        // ============================================
        // GOOGLE LOGIN
        // ============================================

        function handleGoogleLogin() {
            showToast('🔵 Google login coming soon!', 'info');
            // In production, redirect to Google OAuth:
            // window.location.href = '/auth/google';
        }

        // ============================================
        // FACEBOOK LOGIN
        // ============================================

        function handleFacebookLogin() {
            showToast('🔵 Facebook login coming soon!', 'info');
            // In production, redirect to Facebook OAuth:
            // window.location.href = '/auth/facebook';
        }

        // ============================================
        // LOGIN
        // ============================================

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showToast('Please enter email and password', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner"></span> Logging in...`;

            try {
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();
                console.log('Login Response:', result);

                if (result.success && result.user) {
                    const userData = {
                        id: result.user.id || result.user._id,
                        _id: result.user._id || result.user.id,
                        firstName: result.user.firstName || 'User',
                        lastName: result.user.lastName || '',
                        email: result.user.email,
                        phone: result.user.phone || ''
                    };

                    localStorage.setItem('user', JSON.stringify(userData));
                    localStorage.removeItem('currentUser');

                    if (document.getElementById('rememberMe').checked) {
                        localStorage.setItem('rememberMe', email);
                    }

                    showToast('✅ Welcome back, ' + userData.firstName + '!');

                    setTimeout(() => {
                        const redirect = localStorage.getItem('redirectAfterLogin') || '/';
                        localStorage.removeItem('redirectAfterLogin');
                        window.location.href = redirect;
                    }, 1000);

                } else {
                    if (result.message && result.message.toLowerCase().includes('email')) {
                        showToast('❌ Email not found. Please sign up first.', 'error');
                    } else if (result.message && result.message.toLowerCase().includes('password')) {
                        showToast('❌ Incorrect password. Please try again.', 'error');
                    } else {
                        showToast(result.message || 'Login failed', 'error');
                    }
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                }

            } catch (error) {
                console.error('Login Error:', error);
                showToast('Network error. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        }

        // ============================================
        // ENTER KEY SUPPORT
        // ============================================

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const form = document.getElementById('loginForm');
                if (form.contains(e.target)) {
                    e.preventDefault();
                    handleLogin();
                }
            }
        });

        // ============================================
        // AUTO-FILL REMEMBER ME
        // ============================================

        document.addEventListener('DOMContentLoaded', function() {
            const savedEmail = localStorage.getItem('rememberMe');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('rememberMe').checked = true;
            }
            console.log('🔐 Login Page Loaded');
        });
    </script>

</body>
</html>
