<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Verification - AV Sweet House</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- AOS Animation -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background:
        linear-gradient(rgba(255, 240, 246, 0.8),
          rgba(255, 228, 241, 0.8)),
        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1400&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Floating Background Circles */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      animation: float 8s infinite linear;
      backdrop-filter: blur(5px);
    }

    .circle1 {
      width: 220px;
      height: 220px;
      top: -50px;
      left: -50px;
    }

    .circle2 {
      width: 160px;
      height: 160px;
      bottom: 40px;
      right: 60px;
      animation-duration: 10s;
    }

    .circle3 {
      width: 100px;
      height: 100px;
      top: 120px;
      right: 100px;
      animation-duration: 6s;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(180deg);
      }

      100% {
        transform: translateY(0px) rotate(360deg);
      }
    }

    /* OTP CARD */
    .otp-card {
      width: 100%;
      max-width: 430px;
      padding: 40px 30px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .icon-box {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #ff4da6, #ff80bf);
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(255, 77, 166, 0.4);
      animation: pulse 2s infinite;
    }

    .icon-box i {
      font-size: 40px;
      color: white;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    h1 {
      font-weight: 700;
      color: #d63384;
      margin-top: 20px;
    }

    p {
      color: #666;
      font-size: 15px;
      line-height: 1.7;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    /* OTP INPUTS */
    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .otp-inputs input {
      width: 60px;
      height: 65px;
      border-radius: 15px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.7);
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #d63384;
      transition: 0.3s ease;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .otp-inputs input:focus {
      transform: translateY(-5px);
      background: white;
      box-shadow: 0 10px 20px rgba(214, 51, 132, 0.25);
      border: 2px solid #ff4da6;
    }

    /* BUTTON */
    .verify-btn {
      width: 100%;
      padding: 14px;
      margin-top: 30px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff4da6, #d63384);
      color: white;
      font-weight: 600;
      font-size: 16px;
      transition: 0.4s;
      box-shadow: 0 10px 20px rgba(214, 51, 132, 0.3);
    }

    .verify-btn:hover {
      transform: translateY(-3px);
      background: linear-gradient(135deg, #d63384, #ff4da6);
      box-shadow: 0 15px 25px rgba(214, 51, 132, 0.4);
    }

    .verify-btn i {
      margin-left: 8px;
    }

    /* RESEND */
    .resend {
      margin-top: 22px;
      color: #666;
      font-size: 14px;
    }

    .resend a {
      color: #d63384;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .resend a:hover {
      color: #ff4da6;
      text-decoration: underline;
    }

    /* TIMER */
    .timer {
      margin-top: 12px;
      font-size: 14px;
      color: #999;
    }

    /* MOBILE */
    @media(max-width:500px) {
      .otp-card {
        padding: 35px 20px;
      }

      .otp-inputs input {
        width: 52px;
        height: 58px;
      }
    }
  </style>
</head>

<body>

  <!-- Background Animation -->
  <div class="circle circle1"></div>
  <div class="circle circle2"></div>
  <div class="circle circle3"></div>

  <!-- OTP CARD -->
  <div class="otp-card" data-aos="zoom-in">

    <div class="icon-box">
      <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h1>OTP Verification</h1>

    <p>
      Enter the 6-digit OTP sent to your email ❤️
    </p>

    <!-- OTP INPUT -->
    <div class="otp-inputs">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
</div>

    <!-- BUTTON -->
    <button
id="verifyBtn"
class="verify-btn"
onclick="verifyOTP()">
Verify OTP
<i class="bi bi-arrow-right-circle-fill"></i>
</button>
    <!-- RESEND -->
    <a href="#">
Resend OTP
</a>

    <!-- TIMER -->
    <div class="timer">
      Resend available in 00:30
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- AOS Animation -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

  <script>
AOS.init();
</script>

  <script>

    
  // Auto move OTP inputs

  

    

  async function verifyOTP() {


    const btn = document.getElementById("verifyBtn");

btn.disabled = true;
btn.innerHTML = "Please wait...";

    try {

        let otp = "";

        document.querySelectorAll(".otp-inputs input").forEach(input => {
            otp += input.value;
        });

        const signupData = JSON.parse(localStorage.getItem("signupData"));

        console.log("Signup Data:", signupData);
console.log("OTP:", otp);

const otpBody = {
    email: signupData.email,
    otp: otp
};

console.log("Sending:", otpBody);

        console.log("Signup Data:", signupData);

        if (!signupData) {
            alert("Signup data not found. Please sign up again.");
            window.location.href = "signup.html";
            return;
        }

        // Verify OTP
        const otpResponse = await fetch("http://localhost:5000/api/verify-otp", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(otpBody)
        });

        const otpData = await otpResponse.json();

        console.log("OTP Response:", otpData);

        if (!otpData.success) {
            alert("Invalid OTP");
            return;
        }

        console.log("Calling register API...");

        // Register User
        const registerResponse = await fetch("http://localhost:5000/api/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(signupData)
        });

        const registerData = await registerResponse.json();

        console.log("Register Response:", registerData);

        if (registerData.success || registerData.message === "Email already registered") {

    localStorage.removeItem("signupData");

    window.location.replace("login.html");
return;
    

} else {

    alert(registerData.message);

}
    } catch (err) {

        console.error(err);
        alert(err.message);

    }

}
  </script>

</body>

</html>
