<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Verification - AV Sweet House</title>

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #ffe5ec 0%, transparent 30%),
                radial-gradient(circle at bottom right, #d6f6ff 0%, transparent 30%),
                #fffaf7;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Floating Background Circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            animation: float 8s infinite ease-in-out;
            backdrop-filter: blur(5px);
        }

        .circle1 {
            width: 250px;
            height: 250px;
            top: -60px;
            left: -60px;
            background: rgba(255, 77, 141, 0.08);
        }

        .circle2 {
            width: 180px;
            height: 180px;
            bottom: -40px;
            right: -40px;
            background: rgba(255, 77, 141, 0.06);
            animation-duration: 10s;
        }

        .circle3 {
            width: 120px;
            height: 120px;
            top: 30%;
            right: 10%;
            background: rgba(255, 77, 141, 0.05);
            animation-duration: 6s;
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-25px) rotate(180deg);
            }
            100% {
                transform: translateY(0px) rotate(360deg);
            }
        }

        /* ============================================
           OTP CARD
           ============================================ */
        .otp-card {
            width: 100%;
            max-width: 440px;
            padding: 45px 35px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 77, 141, 0.05);
            box-shadow: 0 20px 60px rgba(255, 77, 141, 0.08);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-box {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #ff4d8d, #ff758f);
            margin: 0 auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(255, 77, 141, 0.3);
            animation: pulse 2s infinite;
        }

        .icon-box i {
            font-size: 40px;
            color: white;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        .otp-card h1 {
            font-weight: 800;
            color: #ff4d8d;
            margin-top: 20px;
            font-size: 28px;
        }

        .otp-card .subtitle {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
            margin-bottom: 25px;
        }

        .otp-card .email-display {
            background: #fff0f3;
            padding: 8px 16px;
            border-radius: 30px;
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            color: #ff4d8d;
            margin-bottom: 20px;
        }

        /* ============================================
           OTP INPUTS
           ============================================ */
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .otp-inputs input {
            width: 52px;
            height: 60px;
            border-radius: 15px;
            border: 2px solid #f0e0e0;
            outline: none;
            background: #faf8f8;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #ff4d8d;
            transition: 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        .otp-inputs input:focus {
            transform: translateY(-4px);
            background: white;
            box-shadow: 0 10px 25px rgba(255, 77, 141, 0.15);
            border-color: #ff4d8d;
        }

        .otp-inputs input.error {
            border-color: #dc3545;
            animation: shake 0.4s ease;
        }

        .otp-inputs input.success {
            border-color: #28a745;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }

        /* ============================================
           ERROR MESSAGE
           ============================================ */
        .otp-error {
            color: #dc3545;
            font-size: 13px;
            font-weight: 500;
            margin-top: 8px;
            display: none;
        }

        .otp-error.show {
            display: block;
        }

        /* ============================================
           BUTTON
           ============================================ */
        .verify-btn {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff4d8d, #ff758f);
            color: white;
            font-weight: 700;
            font-size: 16px;
            transition: 0.4s;
            box-shadow: 0 10px 25px rgba(255, 77, 141, 0.25);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .verify-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 77, 141, 0.35);
        }

        .verify-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .verify-btn .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ============================================
           RESEND & TIMER
           ============================================ */
        .resend-section {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .resend-btn {
            color: #ff4d8d;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
            cursor: pointer;
            background: none;
            border: none;
        }

        .resend-btn:hover {
            color: #ff2f78;
            text-decoration: underline;
        }

        .resend-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
            text-decoration: none;
        }

        .timer {
            font-size: 14px;
            color: #999;
            font-weight: 500;
        }

        .timer span {
            color: #ff4d8d;
            font-weight: 700;
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            font-weight: 600;
            animation: slideIn 0.5s ease;
            display: none;
            font-size: 14px;
            max-width: 400px;
        }

        .toast.success {
            background: #28a745;
            display: block;
        }

        .toast.error {
            background: #dc3545;
            display: block;
        }

        .toast.info {
            background: #17a2b8;
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media(max-width: 500px) {
            .otp-card {
                padding: 30px 20px;
            }

            .otp-inputs {
                gap: 8px;
            }

            .otp-inputs input {
                width: 44px;
                height: 52px;
                font-size: 18px;
                border-radius: 12px;
            }

            .otp-card h1 {
                font-size: 24px;
            }

            .icon-box {
                width: 75px;
                height: 75px;
            }

            .icon-box i {
                font-size: 32px;
            }

            .verify-btn {
                font-size: 14px;
                padding: 12px;
            }

            .resend-section {
                flex-direction: column;
                align-items: center;
            }

            .toast {
                top: 10px;
                right: 10px;
                left: 10px;
                font-size: 12px;
                padding: 10px 16px;
                max-width: none;
            }
        }

        @media(max-width: 380px) {
            .otp-inputs input {
                width: 38px;
                height: 46px;
                font-size: 16px;
                border-radius: 10px;
            }

            .otp-card {
                padding: 20px 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating Background Circles -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <!-- ============================================
    OTP CARD
    ============================================ -->
    <div class="otp-card">

        <div class="icon-box">
            <i class="fas fa-shield-alt"></i>
        </div>

        <h1>🔐 OTP Verification</h1>
        <p class="subtitle">Enter the 6-digit OTP sent to your email</p>

        <div class="email-display" id="emailDisplay">
            <i class="fas fa-envelope"></i> example@email.com
        </div>

        <!-- OTP INPUTS -->
        <div class="otp-inputs" id="otpInputs">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus>
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        </div>

        <div class="otp-error" id="otpError">❌ Invalid OTP. Please try again.</div>

        <!-- VERIFY BUTTON -->
        <button class="verify-btn" id="verifyBtn" onclick="verifyOTP()">
            <i class="fas fa-check-circle"></i> Verify OTP
        </button>

        <!-- RESEND & TIMER -->
        <div class="resend-section">
            <button class="resend-btn" id="resendBtn" onclick="resendOTP()" disabled>
                <i class="fas fa-redo"></i> Resend OTP
            </button>
            <div class="timer">
                <i class="fas fa-clock"></i> Resend available in <span id="timerDisplay">00:30</span>
            </div>
        </div>

    </div>

    <!-- ============================================
    TOAST
    ============================================ -->
    <div id="toast" class="toast"></div>

    <script>
        // ============================================
        // SHOW TOAST
        // ============================================

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.style.display = 'none';
            }, 3500);
        }

        // ============================================
        // DISPLAY EMAIL
        // ============================================

        function displayEmail() {
            try {
                const signupData = JSON.parse(localStorage.getItem('signupData'));
                if (signupData && signupData.email) {
                    document.getElementById('emailDisplay').innerHTML =
                        `<i class="fas fa-envelope"></i> ${signupData.email}`;
                }
            } catch (e) {}
        }

        // ============================================
        // AUTO MOVE OTP INPUTS
        // ============================================

        document.querySelectorAll('.otp-inputs input').forEach((input, index, inputs) => {
            // Focus next input on typing
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');

                if (this.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }

                // Clear error when typing
                document.getElementById('otpError').classList.remove('show');
                this.classList.remove('error', 'success');
            });

            // Go back on backspace
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Paste support
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text');
                const digits = paste.replace(/[^0-9]/g, '').slice(0, inputs.length);

                digits.split('').forEach((digit, i) => {
                    if (inputs[i]) {
                        inputs[i].value = digit;
                    }
                });

                const nextIndex = Math.min(digits.length, inputs.length - 1);
                inputs[nextIndex].focus();

                document.getElementById('otpError').classList.remove('show');
            });
        });

        // ============================================
        // GET OTP VALUE
        // ============================================

        function getOTP() {
            let otp = '';
            document.querySelectorAll('.otp-inputs input').forEach(input => {
                otp += input.value;
            });
            return otp;
        }

        // ============================================
        // TIMER
        // ============================================

        let timerSeconds = 30;
        let timerInterval = null;

        function startTimer() {
            const timerDisplay = document.getElementById('timerDisplay');
            const resendBtn = document.getElementById('resendBtn');

            timerSeconds = 30;
            resendBtn.disabled = true;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds--;
                const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                const secs = String(timerSeconds % 60).padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    resendBtn.disabled = false;
                    timerDisplay.textContent = '00:00';
                }
            }, 1000);
        }

        // ============================================
        // RESEND OTP
        // ============================================

        async function resendOTP() {
            const btn = document.getElementById('resendBtn');
            btn.disabled = true;

            try {
                const signupData = JSON.parse(localStorage.getItem('signupData'));
                if (!signupData || !signupData.email) {
                    showToast('Email not found. Please sign up again.', 'error');
                    window.location.href = 'signup.html';
                    return;
                }

                const response = await fetch('http://localhost:5000/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: signupData.email })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('📧 New OTP sent to your email!', 'success');
                    startTimer();
                } else {
                    showToast(data.message || 'Failed to send OTP', 'error');
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Resend Error:', error);
                showToast('Network error. Please try again.', 'error');
                btn.disabled = false;
            }
        }

        // ============================================
        // VERIFY OTP
        // ============================================

        async function verifyOTP() {
            const btn = document.getElementById('verifyBtn');
            const otp = getOTP();

            // Validate OTP
            if (otp.length < 6) {
                document.getElementById('otpError').textContent = '⚠️ Please enter all 6 digits';
                document.getElementById('otpError').classList.add('show');
                document.querySelectorAll('.otp-inputs input').forEach(input => {
                    if (!input.value) input.classList.add('error');
                });
                return;
            }

            // Clear any previous errors
            document.getElementById('otpError').classList.remove('show');
            document.querySelectorAll('.otp-inputs input').forEach(input => {
                input.classList.remove('error', 'success');
            });

            // Show loading
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner"></span> Verifying...`;

            try {
                const signupData = JSON.parse(localStorage.getItem('signupData'));

                if (!signupData || !signupData.email) {
                    showToast('Signup data not found. Please sign up again.', 'error');
                    window.location.href = 'signup.html';
                    return;
                }

                // Verify OTP
                const otpResponse = await fetch('http://localhost:5000/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: signupData.email,
                        otp: otp
                    })
                });

                const otpData = await otpResponse.json();

                if (!otpData.success) {
                    // Show error
                    document.getElementById('otpError').textContent = '❌ Invalid OTP. Please try again.';
                    document.getElementById('otpError').classList.add('show');
                    document.querySelectorAll('.otp-inputs input').forEach(input => {
                        input.classList.add('error');
                    });

                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP';
                    return;
                }

                // OTP Verified - Register User
                showToast('✅ OTP Verified! Creating account...', 'info');

                const registerResponse = await fetch('http://localhost:5000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(signupData)
                });

                const registerData = await registerResponse.json();

                if (registerData.success) {
                    // Show success on inputs
                    document.querySelectorAll('.otp-inputs input').forEach(input => {
                        input.classList.add('success');
                    });

                    showToast('🎉 Account created successfully!', 'success');

                    // Clear signup data and redirect
                    localStorage.removeItem('signupData');

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);

                } else {
                    showToast(registerData.message || 'Failed to create account', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP';
                }

            } catch (error) {
                console.error('Verify Error:', error);
                showToast('Network error. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP';
            }
        }

        // ============================================
        // ENTER KEY SUPPORT
        // ============================================

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const card = document.querySelector('.otp-card');
                if (card.contains(e.target)) {
                    e.preventDefault();
                    verifyOTP();
                }
            }
        });

        // ============================================
        // INIT
        // ============================================

        document.addEventListener('DOMContentLoaded', function() {
            displayEmail();
            startTimer();

            // Focus first input
            document.querySelector('.otp-inputs input').focus();

            console.log('🔐 OTP Verification Page Loaded');
        });
    </script>

</body>

</html>
