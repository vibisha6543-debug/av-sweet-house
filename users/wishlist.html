 <!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wishlist - AV Sweet House</title>

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>

    body{
      font-family:'Poppins',sans-serif;
      background: linear-gradient(135deg,#fff5f8,#f3f9ff);
      min-height:100vh;
    }

    /* HEADER */
    .hero{
      text-align:center;
      padding:120px 20px 40px;
    }

    .hero h1{
      font-size:50px;
      font-weight:800;
      background: linear-gradient(90deg,#ff4d6d,#ff758f);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero p{
      color:#666;
    }

    /* CARD */
    .wish-card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
      transition:0.3s;
      height:100%;
    }

    .wish-card:hover{
      transform:translateY(-6px);
    }

    .wish-card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .wish-content{
      padding:15px;
    }

    .price{
      color:#ff4d6d;
      font-size:20px;
      font-weight:700;
    }

    .btn-remove{
      width:100%;
      margin-top:10px;
      padding:10px;
      border:none;
      border-radius:30px;
      background:#f1f1f1;
      font-weight:600;
      transition:0.3s;
    }

    .btn-remove:hover{
      background:#ff4d6d;
      color:white;
    }

    /* EMPTY */
    .empty-box{
      display:none;
      text-align:center;
      padding:60px 20px;
    }

    .empty-box i{
      font-size:70px;
      color:#ff4d6d;
      margin-bottom:15px;
    }

  </style>

</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>❤️ My Wishlist</h1>
  <p>Save your favorite cakes & desserts</p>
</div>

<!-- WISHLIST CONTAINER -->
<div class="container pb-5">

  <div class="row g-4" id="wishlistContainer"></div>

  <!-- EMPTY STATE -->
  <div class="empty-box" id="emptyWishlist">
    <i class="fa-regular fa-heart"></i>
    <h3>Your Wishlist is Empty</h3>
    <p>Add your favorite items ❤️</p>
    <a href="index.html" class="btn btn-outline-danger">
🏠 Continue Shopping
</a>
  </div>

</div>

<!-- JS -->
<script>

let wishlist =
JSON.parse(localStorage.getItem("wishlist")) || [];

let container =
document.getElementById("wishlistContainer");

let emptyBox =
document.getElementById("emptyWishlist");

if(wishlist.length === 0){

    emptyBox.style.display = "block";

}else{

    wishlist.forEach((item,index)=>{

        container.innerHTML += `

        <div class="col-md-4">

            <div class="wish-card">

                <img src="${item.image}">

                <div class="wish-content">

                    <h5>${item.name}</h5>

                    <div class="price">
                        ₹${item.price}
                    </div>

                    <button
                    class="btn btn-danger w-100 mt-3"
                    onclick="moveToCart(${index})">

                        🛒 Move To Cart

                    </button>

                    <button
                    class="btn-remove"
                    onclick="removeWishlist(${index})">

                        Remove

                    </button>

                </div>

            </div>

        </div>

        `;

    });

}

function removeWishlist(index){

    wishlist.splice(index,1);

    localStorage.setItem(
        "wishlist",
        JSON.stringify(wishlist)
    );

    location.reload();

}

function moveToCart(index){

    let cart =
    JSON.parse(localStorage.getItem("cart")) || [];

    let existing =
    cart.find(item =>
    item.name === wishlist[index].name);

    if(existing){

        existing.qty++;

    }else{

        cart.push({
            name: wishlist[index].name,
            price: wishlist[index].price,
            image: wishlist[index].image,
            qty: 1
        });

    }

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    wishlist.splice(index,1);

    localStorage.setItem(
        "wishlist",
        JSON.stringify(wishlist)
    );

    alert("Moved To Cart 🛒");

    location.reload();
}
</script>

</body>

</html>
