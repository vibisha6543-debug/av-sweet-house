 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - AV Sweet House</title>

    <!-- ===== FAVICON ===== -->
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff5f8, #f3f9ff);
            min-height: 100vh;
            padding-top: 80px;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(14px);
            padding: 12px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 30px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff4d6d, #ff758f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            color: #777;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: #444;
            font-weight: 600;
            transition: .3s;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #ff4d6d;
        }

        .nav-links .wishlist-link {
            background: #ff4d6d;
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
        }

        .nav-links .wishlist-link:hover {
            background: #ff2f5a;
            color: white;
        }

        .badge-count {
            background: #ff4d6d;
            color: white;
            border-radius: 50%;
            padding: 1px 7px;
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
            margin-left: 4px;
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 30px 20px 20px;
        }

        .hero h1 {
            font-size: 44px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff4d6d, #ff758f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: #666;
            font-size: 16px;
        }

        /* ===== CARD ===== */
        .wish-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
            border: 1px solid rgba(255, 77, 109, 0.05);
        }

        .wish-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(255, 77, 109, 0.12);
        }

        .wish-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: 0.5s;
        }

        .wish-card:hover img {
            transform: scale(1.03);
        }

        .wish-content {
            padding: 18px;
        }

        .wish-content h5 {
            font-weight: 700;
            font-size: 18px;
            color: #333;
            min-height: 48px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .wish-content .category-tag {
            display: inline-block;
            background: #fff0f3;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #ff4d6d;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .price {
            color: #ff4d6d;
            font-size: 22px;
            font-weight: 700;
        }

        .btn-move-cart {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 30px;
            background: #ff4d6d;
            color: white;
            font-weight: 700;
            transition: 0.3s;
            font-size: 14px;
        }

        .btn-move-cart:hover {
            background: #ff2f5a;
            transform: scale(1.02);
        }

        .btn-remove {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            border: none;
            border-radius: 30px;
            background: #f1f1f1;
            color: #555;
            font-weight: 600;
            transition: 0.3s;
            font-size: 13px;
        }

        .btn-remove:hover {
            background: #ff4d6d;
            color: white;
        }

        /* ===== EMPTY STATE ===== */
        .empty-box {
            display: none;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .empty-box i {
            font-size: 70px;
            color: #ff4d6d;
            margin-bottom: 15px;
        }

        .empty-box h3 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .empty-box p {
            color: #777;
            margin-bottom: 20px;
        }

        .empty-box .btn-shop {
            display: inline-block;
            background: #ff4d6d;
            color: white;
            padding: 12px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
            border: none;
        }

        .empty-box .btn-shop:hover {
            background: #ff2f5a;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.3);
        }

        .empty-box .btn-login {
            display: inline-block;
            background: transparent;
            color: #ff4d6d;
            padding: 12px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
            border: 2px solid #ff4d6d;
        }

        .empty-box .btn-login:hover {
            background: #ff4d6d;
            color: white;
            transform: translateY(-3px);
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            text-align: center;
            padding: 60px 0;
        }

        .loading-spinner .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff4d6d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ============================================
                   RESPONSIVE
                   ============================================ */

        @media(max-width: 992px) {
            .navbar {
                padding: 10px 20px;
            }

            .logo-text h1 {
                font-size: 20px;
            }

            .nav-links {
                gap: 14px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .hero h1 {
                font-size: 38px;
            }
        }

        @media(max-width: 768px) {
            body {
                padding-top: 70px;
            }

            .navbar {
                padding: 8px 15px;
                gap: 8px;
            }

            .logo {
                gap: 8px;
            }

            .logo-icon {
                font-size: 24px;
            }

            .logo-text h1 {
                font-size: 17px;
            }

            .logo-text p {
                display: none;
            }

            .nav-links {
                gap: 10px;
                width: 100%;
                justify-content: center;
                padding-top: 5px;
                border-top: 1px solid #f0f0f0;
            }

            .nav-links a {
                font-size: 12px;
            }

            .nav-links .wishlist-link {
                padding: 4px 14px;
                font-size: 12px;
            }

            .hero {
                padding: 20px 15px 10px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero p {
                font-size: 14px;
            }

            .wish-card img {
                height: 180px;
            }

            .wish-content h5 {
                font-size: 16px;
                min-height: 40px;
            }

            .price {
                font-size: 19px;
            }

            .btn-move-cart,
            .btn-remove {
                font-size: 13px;
                padding: 8px;
            }

            .empty-box {
                padding: 40px 20px;
            }

            .empty-box i {
                font-size: 55px;
            }

            .empty-box h3 {
                font-size: 22px;
            }
        }

        @media(max-width: 480px) {
            body {
                padding-top: 60px;
            }

            .navbar {
                padding: 6px 10px;
            }

            .logo-icon {
                font-size: 20px;
            }

            .logo-text h1 {
                font-size: 14px;
            }

            .nav-links {
                gap: 6px;
                padding-top: 4px;
            }

            .nav-links a {
                font-size: 10px;
            }

            .nav-links .wishlist-link {
                padding: 3px 10px;
                font-size: 10px;
            }

            .hero h1 {
                font-size: 24px;
            }

            .hero p {
                font-size: 12px;
            }

            .wish-card img {
                height: 150px;
            }

            .wish-content {
                padding: 14px;
            }

            .wish-content h5 {
                font-size: 14px;
                min-height: 34px;
            }

            .price {
                font-size: 17px;
            }

            .btn-move-cart,
            .btn-remove {
                font-size: 12px;
                padding: 7px;
            }

            .empty-box {
                padding: 30px 15px;
            }

            .empty-box i {
                font-size: 45px;
            }

            .empty-box h3 {
                font-size: 18px;
            }

            .empty-box p {
                font-size: 13px;
            }

            .empty-box .btn-shop,
            .empty-box .btn-login {
                padding: 10px 25px;
                font-size: 13px;
            }
        }

        /* ===== TOAST ===== */
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            font-weight: 600;
            animation: slideIn 0.5s ease;
            max-width: 400px;
            font-size: 14px;
        }

        .toast-message.success {
            background: #28a745;
        }

        .toast-message.error {
            background: #dc3545;
        }

        .toast-message.info {
            background: #17a2b8;
        }

        @media(max-width: 480px) {
            .toast-message {
                bottom: 20px;
                right: 20px;
                left: 20px;
                font-size: 12px;
                padding: 12px 18px;
                max-width: none;
            }
        }
    </style>
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <div class="navbar">
        <a href="/" class="logo">
            <div class="logo-icon">🍰</div>
            <div class="logo-text">
                <h1>AV Sweet House</h1>
                <p>PREMIUM DESSERTS</p>
            </div>
        </a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="wishlist.html" class="wishlist-link">❤️ Wishlist</a>
            <a href="cart.html">🛒 Cart</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>

    <!-- ===== HERO ===== -->
    <div class="hero">
        <h1>❤️ My Wishlist</h1>
        <p>Save your favorite cakes & desserts</p>
    </div>

    <!-- ===== WISHLIST CONTAINER ===== -->
    <div class="container pb-5">
        <div class="row g-4" id="wishlistContainer"></div>

        <!-- EMPTY STATE -->
        <div class="empty-box" id="emptyWishlist">
            <i class="fa-regular fa-heart"></i>
            <h3>Your Wishlist is Empty</h3>
            <p>Add your favorite items and save them for later ❤️</p>
            <a href="/" class="btn-shop">🏠 Start Shopping</a>
        </div>
    </div>

    <script>
        // ============================================
        // GET USER
        // ============================================

        function getUser() {
            try {
                let userData = localStorage.getItem('user');
                if (userData) {
                    return JSON.parse(userData);
                }
                userData = localStorage.getItem('currentUser');
                if (userData) {
                    const user = JSON.parse(userData);
                    localStorage.setItem('user', JSON.stringify(user));
                    localStorage.removeItem('currentUser');
                    return user;
                }
                return null;
            } catch (e) {
                console.error('Get User Error:', e);
                return null;
            }
        }

        // ============================================
        // SHOW TOAST
        // ============================================

        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast-message');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast-message ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOut 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ============================================
        // LOAD WISHLIST
        // ============================================

        const container = document.getElementById("wishlistContainer");
        const emptyBox = document.getElementById("emptyWishlist");

        async function loadWishlist() {
            const user = getUser();

            // Show loading
            container.innerHTML = `
                    <div class="col-12">
                        <div class="loading-spinner">
                            <div class="spinner"></div>
                            <p style="color:#888;">Loading your wishlist...</p>
                        </div>
                    </div>
                `;
            emptyBox.style.display = "none";

            // Check login
            if (!user) {
                container.innerHTML = "";
                emptyBox.style.display = "block";
                emptyBox.innerHTML = `
                        <i class="fa-regular fa-heart"></i>
                        <h3>Please Login First</h3>
                        <p>Login to see your wishlist ❤️</p>
                        <a href="login.html" class="btn-login">Login Now</a>
                    `;
                return;
            }

            try {
                const userId = user.id || user._id;
                console.log('🔍 Fetching wishlist for user:', userId);

                // Add cache busting
                const response = await fetch(`http://localhost:5000/api/wishlist/${userId}?_=${Date.now()}`);

                if (!response.ok) {
                    throw new Error('Failed to load wishlist');
                }

                const wishlist = await response.json();
                console.log(`✅ Loaded ${wishlist.length} wishlist items`);

                container.innerHTML = "";

                if (!wishlist || wishlist.length === 0) {
                    emptyBox.style.display = "block";
                    emptyBox.innerHTML = `
                            <i class="fa-regular fa-heart"></i>
                            <h3>Your Wishlist is Empty</h3>
                            <p>Add your favorite items and save them for later ❤️</p>
                            <a href="/" class="btn-shop">🏠 Start Shopping</a>
                        `;
                    return;
                }

                emptyBox.style.display = "none";

                wishlist.forEach((item) => {
                    // Use BOTH IDs for different purposes
                    const entryId = item._id; // Wishlist entry ID
                    const productId = item.productId; // Product ID for deletion

                    container.innerHTML += `
                            <div class="col-md-4 col-sm-6">
                                <div class="wish-card">
                                    <img src="${item.image || 'https://via.placeholder.com/300?text=No+Image'}" 
                                         alt="${item.name}" 
                                         loading="lazy"
                                         onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                                    <div class="wish-content">
                                        <span class="category-tag">${item.category || 'Dessert'}</span>
                                        <h5>${item.name || 'Product'}</h5>
                                        <div class="price">₹${Number(item.price).toFixed(0)}</div>
                                        <button class="btn-move-cart" onclick="moveToCart('${entryId}')">
                                            🛒 Move To Cart
                                        </button>
                                        <button class="btn-remove" onclick="removeFromWishlist('${entryId}')">
                                            ❌ Remove
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                });

            } catch (error) {
                console.error("❌ Wishlist Error:", error);
                container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <p class="text-danger">⚠️ Failed to load wishlist: ${error.message}</p>
                            <button onclick="loadWishlist()" class="btn btn-danger">🔄 Retry</button>
                        </div>
                    `;
            }
        }

        // ============================================
        // REMOVE FROM WISHLIST (FIXED - Uses productId)
        // ============================================

        async function removeFromWishlist(entryId) {
            console.log('🔍 REMOVE FUNCTION CALLED');
            console.log('📌 Entry ID (clicked):', entryId);

            const user = getUser();

            if (!user) {
                showToast('Please login first', 'error');
                return;
            }

            if (!entryId) {
                showToast('Invalid ID', 'error');
                return;
            }

            if (!confirm('Remove this item from wishlist?')) return;

            const userId = user.id || user._id;

            try {
                // STEP 1: Get current wishlist to find the productId
                console.log('📡 Fetching current wishlist...');
                const response = await fetch(`http://localhost:5000/api/wishlist/${userId}?_=${Date.now()}`);
                const wishlist = await response.json();

                // STEP 2: Find the item by _id (the entry ID we clicked)
                const item = wishlist.find(item => String(item._id) === String(entryId));

                if (!item) {
                    console.error('❌ Item not found in wishlist!');
                    showToast('Item not found', 'error');
                    return;
                }

                console.log('✅ Found item:', item.name);
                console.log('📋 Product ID for deletion:', item.productId);

                // STEP 3: Use the PRODUCT ID for deletion
                const productIdToDelete = item.productId;
                console.log(`🗑️ Deleting with PRODUCT ID: ${productIdToDelete}`);

                // STEP 4: Delete using productId
                const deleteResponse = await fetch(`http://localhost:5000/api/wishlist/${userId}/${productIdToDelete}`, {
                    method: "DELETE"
                });

                const deleteData = await deleteResponse.json();
                console.log('📦 Delete Response:', deleteData);

                if (deleteResponse.ok && deleteData.success) {
                    showToast(`✅ ${item.name} removed from Wishlist`);

                    // Update count
                    await updateWishlistCount();

                    // Force reload with cache busting
                    setTimeout(() => {
                        window.location.reload(true);
                    }, 400);

                } else {
                    showToast(deleteData.message || 'Failed to remove', 'error');
                }

            } catch (error) {
                console.error('❌ Remove Error:', error);
                showToast('Network error. Please try again.', 'error');
            }
        }

        // ============================================
        // MOVE TO CART (FIXED)
        // ============================================

        async function moveToCart(entryId) {
            console.log('🔍 Move to Cart called with entry ID:', entryId);

            const user = getUser();

            if (!user) {
                showToast('Please login first', 'error');
                return;
            }

            const userId = user.id || user._id;

            try {
                // Get the wishlist item
                const response = await fetch(`http://localhost:5000/api/wishlist/${userId}?_=${Date.now()}`);
                const wishlist = await response.json();

                const item = wishlist.find(item => String(item._id) === String(entryId));

                if (!item) {
                    showToast('Item not found in wishlist', 'error');
                    return;
                }

                console.log('✅ Found item to move:', item.name);

                // Add to cart
                const cartResponse = await fetch('http://localhost:5000/api/cart/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: String(userId),
                        productId: String(item.productId),
                        name: item.name,
                        price: Number(item.price),
                        image: item.image,
                        category: item.category || 'Dessert',
                        quantity: 1
                    })
                });

                const cartResult = await cartResponse.json();

                if (cartResult.success) {
                    // Remove from wishlist using PRODUCT ID
                    await fetch(`http://localhost:5000/api/wishlist/${userId}/${item.productId}`, {
                        method: "DELETE"
                    });

                    showToast(`🛒 ${item.name} moved to Cart!`);
                    await updateWishlistCount();

                    setTimeout(() => {
                        window.location.reload(true);
                    }, 400);
                } else {
                    showToast(cartResult.message || 'Failed to move to cart', 'error');
                }
            } catch (error) {
                console.error('❌ Move to Cart Error:', error);
                showToast('Network error. Please try again.', 'error');
            }
        }

        // ============================================
        // UPDATE WISHLIST COUNT
        // ============================================

        async function updateWishlistCount() {
            const user = getUser();
            const badges = document.querySelectorAll('.badge-count, #wishlistCount, .wishlist-badge');

            if (!user) {
                badges.forEach(badge => badge.innerText = "0");
                return;
            }

            const userId = user.id || user._id;
            if (!userId) {
                badges.forEach(badge => badge.innerText = "0");
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/api/wishlist/${userId}?_=${Date.now()}`);
                const result = await response.json();

                let count = 0;
                if (Array.isArray(result)) {
                    count = result.length;
                }

                badges.forEach(badge => {
                    badge.innerText = count;
                });

            } catch (error) {
                console.error("❌ Wishlist Count Error:", error);
                badges.forEach(badge => badge.innerText = "0");
            }
        }

        // ============================================
        // INIT
        // ============================================

        document.addEventListener('DOMContentLoaded', function() {
            loadWishlist();
            updateWishlistCount();
            console.log('❤️ AV Sweet House - Wishlist Page Loaded');
            console.log('📌 User:', getUser() ? 'Logged In' : 'Guest');
        });
    </script>

</body>

</html>
