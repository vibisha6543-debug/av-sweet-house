 <!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wishlist - AV Sweet House</title>

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>

    body{
      font-family:'Poppins',sans-serif;
      background: linear-gradient(135deg,#fff5f8,#f3f9ff);
      min-height:100vh;
    }

    /* HEADER */
    .hero{
      text-align:center;
      padding:120px 20px 40px;
    }

    .hero h1{
      font-size:50px;
      font-weight:800;
      background: linear-gradient(90deg,#ff4d6d,#ff758f);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero p{
      color:#666;
    }

    /* CARD */
    .wish-card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
      transition:0.3s;
      height:100%;
    }

    .wish-card:hover{
      transform:translateY(-6px);
    }

    .wish-card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .wish-content{
      padding:15px;
    }

    .price{
      color:#ff4d6d;
      font-size:20px;
      font-weight:700;
    }

    .btn-remove{
      width:100%;
      margin-top:10px;
      padding:10px;
      border:none;
      border-radius:30px;
      background:#f1f1f1;
      font-weight:600;
      transition:0.3s;
    }

    .btn-remove:hover{
      background:#ff4d6d;
      color:white;
    }

    /* EMPTY */
    .empty-box{
      display:none;
      text-align:center;
      padding:60px 20px;
    }

    .empty-box i{
      font-size:70px;
      color:#ff4d6d;
      margin-bottom:15px;
    }

  </style>

</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>❤️ My Wishlist</h1>
  <p>Save your favorite cakes & desserts</p>
</div>

<!-- WISHLIST CONTAINER -->
<div class="container pb-5">

  <div class="row g-4" id="wishlistContainer"></div>

  <!-- EMPTY STATE -->
  <div class="empty-box" id="emptyWishlist">
    <i class="fa-regular fa-heart"></i>
    <h3>Your Wishlist is Empty</h3>
    <p>Add your favorite items ❤️</p>
    <a href="index.html" class="btn btn-outline-danger">
🏠 Continue Shopping
</a>
  </div>

</div>

<!-- JS -->

<script>

const currentUser =
    JSON.parse(localStorage.getItem("currentUser"));

const container =
    document.getElementById("wishlistContainer");

const emptyBox =
    document.getElementById("emptyWishlist");


// CHECK LOGIN
if (!currentUser) {

    emptyBox.style.display = "block";

    emptyBox.innerHTML = `
        <i class="fa-regular fa-heart"></i>
        <h3>Please Login First</h3>
        <p>Login to see your wishlist ❤️</p>
        <a href="login.html" class="btn btn-outline-danger">
            Login
        </a>
    `;

} else {

    const userId =
        currentUser._id || currentUser.id;

    loadWishlist(userId);

}


// LOAD WISHLIST
async function loadWishlist(userId) {

    try {

        const response = await fetch(
            `http://localhost:5000/api/wishlist/${userId}`
        );

        const wishlist =
            await response.json();

        container.innerHTML = "";

        if (!wishlist || wishlist.length === 0) {

            emptyBox.style.display = "block";

            return;
        }

        emptyBox.style.display = "none";


        wishlist.forEach(item => {

            container.innerHTML += `

                <div class="col-md-4">

                    <div class="wish-card">

                        <img src="${item.image}">

                        <div class="wish-content">

                            <h5>${item.name}</h5>

                            <div class="price">
                                ₹${item.price}
                            </div>

                            <button
                                class="btn btn-danger w-100 mt-3"
                                onclick="moveToCart(
                                    '${item.productId}',
                                    '${item.name.replace(/'/g, "\\'")}',
                                    ${item.price},
                                    '${item.image.replace(/'/g, "\\'")}'
                                )">

                                🛒 Move To Cart

                            </button>

                            <button
                                class="btn-remove"
                                onclick="removeWishlist(
                                    '${item.productId}'
                                )">

                                Remove

                            </button>

                        </div>

                    </div>

                </div>

            `;

        });

    } catch (error) {

        console.error("Wishlist Error:", error);

        alert("Failed to load wishlist");

    }

}


// REMOVE WISHLIST
async function removeWishlist(productId, fromCart = false) {

    const userId =
        currentUser._id || currentUser.id;

    try {

        const response = await fetch(
            `http://localhost:5000/api/wishlist/${userId}/${productId}`,
            {
                method: "DELETE"
            }
        );

        const data =
            await response.json();

        if (data.success) {

            if (fromCart) {
                alert("Moved To Cart 🛒");
            } else {
                alert("Removed from Wishlist ❤️");
            }

            loadWishlist(userId);

        } else {

            alert("Remove failed");

        }

    } catch (error) {

        console.error(error);

        alert("Server connection failed");

    }

}

// MOVE TO CART
function moveToCart(
    productId,
    name,
    price,
    image
) {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];


    let existing =
        cart.find(item =>
            item.name === name
        );


    if (existing) {

        existing.qty++;

    } else {

        cart.push({

            name: name,

            price: price,

            image: image,

            qty: 1

        });

    }


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    // Remove from MongoDB wishlist
    removeWishlist(productId, true);

}

</script>

</body>

</html>
