<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - AV Sweet House</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff0f6, #ffe4f1);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .signup-container {
      width: 100%;
      max-width: 1000px;
      background: white;
      border-radius: 25px;
      overflow: hidden;
      display: flex;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    /* LEFT */
    .left {
      flex: 1;
      background: linear-gradient(135deg, #d63384, #ff66a3);
      color: white;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .left h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .left p {
      line-height: 1.7;
      font-size: 16px;
    }

    .left img {
      width: 100%;
      max-width: 320px;
      margin-top: 30px;
    }

    /* RIGHT */
    .right {
      flex: 1;
      padding: 45px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right h2 {
      color: #d63384;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .right p {
      color: #777;
      margin-bottom: 25px;
    }

    .input-box {
      margin-bottom: 16px;
    }

    .input-box label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 500;
    }

    .input-box input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      outline: none;
      transition: 0.3s;
    }

    .input-box input:focus {
      border-color: #d63384;
      box-shadow: 0 0 5px rgba(214, 51, 132, 0.3);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .terms {
      margin: 15px 0;
      font-size: 14px;
      color: #666;
    }

    .terms a {
      color: #d63384;
      text-decoration: none;
      font-weight: 500;
    }

    .btn {
      width: 100%;
      background: #d63384;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
      text-decoration: none;
      text-align: center;
      display: block;
    }

    .btn:hover {
      background: #b91c68;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .login-link a {
      color: #d63384;
      text-decoration: none;
      font-weight: 600;
    }

    /* MOBILE */
    @media(max-width:900px) {
      .signup-container {
        flex-direction: column;
      }

      .left {
        text-align: center;
        align-items: center;
      }

      .left h1 {
        font-size: 34px;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="signup-container">

    <!-- LEFT -->
    <div class="left">

      <h1>Join AV Sweet House 🍰</h1>

      <p>
        Create your account and enjoy delicious cakes,
        desserts, chocolates, brownies and more ❤️
      </p>

      <img src="https://cdn-icons-png.flaticon.com/512/2276/2276931.png" alt="Dessert">

    </div>

    <!-- RIGHT -->
    <div class="right">

      <h2>Create Account</h2>
 
      <p>Start your sweet journey today ✨</p>

      <div class="row">

        <div class="input-box">
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="First Name">
        </div>

        <div class="input-box">
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="Last Name">
        </div>

      </div>

      <div class="input-box">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email">
      </div>

      <div class="input-box">
        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="Enter phone number">
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create password">
      </div>

      <div class="input-box">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password">
      </div>

      <div class="terms">
        <label>
          <input type="checkbox">
          I agree to the
          <a href="#">Terms & Conditions</a>
        </label>
      </div>

      <button class="btn" onclick="signupUser()">
       Create Account
      </button>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>

  </div>
  <script>

async function signupUser() {

    let firstName = document.getElementById("firstName").value;
    let lastName = document.getElementById("lastName").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (
        firstName === "" ||
        lastName === "" ||
        email === "" ||
        phone === "" ||
        password === ""
    ) {
        alert("Please fill all fields");
        return;
    }

    if (password !== confirmPassword) {
        alert("Passwords do not match");
        return;
    }

    const response = await fetch("http://127.0.0.1:5000/api/send-otp", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            email: email
        })

    });

    const data = await response.json();

    if (data.success) {

        const signupData = {
    firstName,
    lastName,
    email,
    phone,
    password
};

localStorage.setItem("signupData", JSON.stringify(signupData));

console.log(localStorage.getItem("signupData"));

alert("✅ OTP Sent To Your Email");

setTimeout(() => {
    window.location.href = "verify-otp.html";
}, 500);

    } else {

        alert(data.message);

    }

}
</script>

</body>

</html>
