<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AV Sweet House - Cart</title>

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ICONS -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;

  background:
  radial-gradient(circle at top left,#ffe5ec 0%,transparent 30%),
  radial-gradient(circle at bottom right,#d6f6ff 0%,transparent 30%),
  #fffaf7;

  overflow-x:hidden;
}

/* NAVBAR */

.navbar{
  background:rgba(255,255,255,0.75);

  backdrop-filter:blur(14px);

  padding:18px 40px;

  box-shadow:0 10px 30px rgba(0,0,0,0.05);

  position:sticky;
  top:0;
  z-index:1000;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo-icon{
  font-size:40px;
}

.logo-text h1{
  font-size:32px;
  font-weight:800;

  background:linear-gradient(90deg,#ff4d6d,#ff758f);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.logo-text p{
  color:#777;
  font-size:13px;
  letter-spacing:2px;
}

.nav-links{
  display:flex;
  gap:30px;
}

.nav-links a{
  text-decoration:none;
  color:#444;
  font-weight:600;
  transition:0.3s;
}

.nav-links a:hover{
  color:#ff4d6d;
}

/* MAIN */

.cart-container{
  max-width:1300px;
  margin:auto;
  padding:60px 30px;

  display:grid;
  grid-template-columns:1fr 380px;
  gap:35px;
}

/* LEFT */

.cart-title{
  font-size:60px;
  font-weight:800;

  background:linear-gradient(90deg,#ff4d6d,#ff758f);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  margin-bottom:10px;
}

.cart-sub{
  color:#666;
  margin-bottom:35px;
  font-size:18px;
}

/* CARD */

.cart-card{
  background:rgba(255,255,255,0.75);

  backdrop-filter:blur(14px);

  border-radius:30px;

  padding:20px;

  margin-bottom:25px;

  box-shadow:0 15px 40px rgba(0,0,0,0.06);

  transition:0.4s;
}

.cart-card:hover{
  transform:translateY(-8px);

  box-shadow:0 25px 60px rgba(255,77,109,0.15);
}

.product{
  display:flex;
  gap:20px;
}

.product-image{
  width:150px;
  height:150px;

  border-radius:24px;

  background:#fff0f3;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:70px;

  flex-shrink:0;
}

.product-content{
  flex:1;
}

.product-content h3{
  font-size:26px;
  font-weight:700;
}

.product-sub{
  color:#777;
  margin-top:8px;
}

.tag{
  display:inline-block;

  margin-top:12px;

  padding:8px 16px;

  border-radius:50px;

  background:#fff0f3;

  color:#ff4d6d;

  font-size:13px;
  font-weight:600;
}

.price{
  display:flex;
  align-items:center;
  gap:14px;

  margin-top:16px;
}

.new-price{
  color:#ff4d6d;

  font-size:30px;
  font-weight:700;
}

.old-price{
  color:#aaa;

  text-decoration:line-through;

  font-size:18px;
}

.cart-bottom{
  margin-top:22px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* QTY */

.qty-box{
  display:flex;
  align-items:center;
  gap:15px;

  background:#fff0f3;

  padding:10px 18px;

  border-radius:50px;
}

.qty-btn{
  width:36px;
  height:36px;

  border:none;

  border-radius:50%;

  background:white;

  color:#ff4d6d;

  font-size:20px;
  font-weight:700;

  cursor:pointer;

  transition:0.3s;

  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.qty-btn:hover{
  background:#ff4d6d;
  color:white;
}

.qty{
  font-size:18px;
  font-weight:700;
}

/* REMOVE */

.remove-btn{
  border:none;

  padding:12px 18px;

  border-radius:50px;

  background:#f3f3f3;

  color:#444;

  font-weight:600;

  cursor:pointer;

  transition:0.3s;
}

.remove-btn:hover{
  background:#ff4d6d;
  color:white;
}

/* SUMMARY */

.cart-summary{
  background:rgba(255,255,255,0.75);

  backdrop-filter:blur(14px);

  border-radius:32px;

  padding:30px;

  height:fit-content;

  box-shadow:0 15px 40px rgba(0,0,0,0.06);

  position:sticky;
  top:120px;
}

.cart-summary h2{
  font-size:34px;
  font-weight:800;

  background:linear-gradient(90deg,#ff4d6d,#ff758f);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  margin-bottom:30px;
}

.summary-row{
  display:flex;
  justify-content:space-between;

  margin-bottom:22px;

  color:#555;
}

.summary-total{
  border-top:2px dashed #ffd2dc;

  padding-top:20px;

  margin-top:20px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.summary-total h3{
  font-size:24px;
}

.summary-total span{
  font-size:36px;
  font-weight:800;
  color:#ff4d6d;
}

/* DELIVERY */

.delivery{
  margin-top:25px;

  background:#fff0f3;

  border-radius:22px;

  padding:18px;

  color:#666;

  line-height:1.8;
}

/* GIFT */

.gift{
  margin-top:20px;

  background:linear-gradient(135deg,#ffedf2,#fff7fa);

  border-radius:22px;

  padding:18px;

  color:#ff4d6d;

  font-weight:600;

  text-align:center;
}

/* BUTTON */

.checkout-btn{
  width:100%;

  margin-top:25px;

  border:none;

  padding:18px;

  border-radius:50px;

  background:linear-gradient(135deg,#ff4d6d,#ff758f);

  color:white;

  font-size:17px;
  font-weight:700;

  cursor:pointer;

  transition:0.3s;

  box-shadow:0 12px 30px rgba(255,77,109,0.25);
}

.checkout-btn:hover{
  transform:translateY(-4px);
}

/* MOBILE */

@media(max-width:900px){

  .cart-container{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .navbar{
    padding:15px 20px;
  }

  .nav-links{
    display:none;
  }

  .cart-title{
    font-size:42px;
  }

  .product{
    flex-direction:column;
  }

  .product-image{
    width:100%;
    height:220px;
  }

  .cart-bottom{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
  }

}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

  <div class="logo">

    <div class="logo-icon">
      🍰
    </div>

    <div class="logo-text">

      <h1>AV Sweet House</h1>

      <p>PREMIUM DESSERTS</p>

    </div>

  </div>

  <div class="nav-links">

    <a href="#">Home</a>
    <a href="#">Wishlist</a>
    <a href="#">Cart</a>
    <a href="#">Contact</a>

  </div>

</div>

<!-- MAIN -->

<div class="cart-container">

  <!-- LEFT -->

  <div>

    <div class="cart-title">
      My Cart
    </div>

    <div class="cart-sub">
      Freshly baked desserts crafted with love ❤️
    </div>
     <div id="cartItems"></div>

     </div>
    
  <!-- SUMMARY -->

  <div class="cart-summary">

    <h2>Order Summary</h2>

    <div class="summary-row">

      <span>Subtotal</span>
     <span id="subtotal">₹0</span>
      <!-- <span>₹1997</span> -->

    </div>

    <div class="summary-row">
    <span>Delivery</span>
    <span id="delivery">₹0</span>
</div>

    <div class="summary-row">

      <span>Discount</span>

      <span id="discount">₹0</span>

    </div>

    <div class="summary-total">

      <h3>Total</h3>

      <!-- <span>₹1797</span> -->
       <span id="total">₹0</span>
    </div>

    <div class="delivery">

      🚚 Delivery in 30 mins <br>

      Fresh cakes delivered safely ❤️

    </div>

    <div class="gift">

      🎁 FREE Cookie Included With This Order

    </div>

    <button
class="checkout-btn"
onclick="window.location.href='checkout.html'">

    <i class="fa-solid fa-bag-shopping"></i>

    Proceed To Checkout

</button>

  </div>

</div>
<script src="cart.js"></script>

<script>

function loadCart(){

    let container =
    document.getElementById("cartItems");

    let subtotal =
    document.getElementById("subtotal");

    let total =
    document.getElementById("total");

    
    container.innerHTML = "";

    let grandTotal = 0;

    console.log(cart);

if(cart.length === 0){

        container.innerHTML = `
        <div class="cart-card">
            <h2>Your Cart is Empty 🛒</h2>
            <p>Add some delicious cakes and desserts.</p>
        </div>
        `;

        subtotal.innerText = "₹0";
        total.innerText = "₹0";

        return;
    }

    cart.forEach(item => {

        grandTotal += item.price * item.quantity;

        container.innerHTML += `

        <div class="cart-card">

            <div class="product">

                <div class="product-image">
               <img src="${item.image}"
               style="
             width:100%;      
             height:100%;
             object-fit:cover;
            border-radius:24px;
              ">
               </div>

                <div class="product-content">

                    <h3>${item.name}</h3>

                    <div class="price">

                        <div class="new-price">
                            ₹${item.price}
                        </div>

                    </div>
                    ${item.weight ? `<p><b>🎂 Weight:</b> ${item.weight}</p>` : ""}

${item.flavor ? `<p><b>🍫 Flavor:</b> ${item.flavor}</p>` : ""}

${item.message ? `<p><b>✍ Cake Message:</b> ${item.message}</p>` : ""}

${item.packSize ? `<p><b>📦 Pack Size:</b> ${item.packSize}</p>` : ""}

${item.bottleSize ? `<p><b>🥤 Bottle Size:</b> ${item.bottleSize}</p>` : ""}

                    <div class="cart-bottom">

                        <div class="qty-box">

                            <button
                            class="qty-btn"
                            onclick="decreaseQty(${item.id})">
                            -
                            </button>

                            <div class="qty">
                                ${item.quantity}
                            </div>

                            <button
                            class="qty-btn"
                            onclick="increaseQty(${item.id})">
                            +
                            </button>

                        </div>

                       <button
class="remove-btn"
onclick="
removeFromCart(${item.id});
loadCart();
">
Remove
</button>
                    </div>

                </div>

            </div>

        </div>

        `;

    });

    let delivery = 0;

if (grandTotal < 500) {
    delivery = 40;
}

let discount = 0;

if (grandTotal >= 1000) {
    discount = grandTotal * 0.10;
}
document.getElementById("discount").innerText =
"- ₹" + discount.toFixed(0);

let finalTotal = grandTotal + delivery - discount;

subtotal.innerText = "₹" + grandTotal;

document.getElementById("delivery").innerText = "₹" + delivery;

document.getElementById("discount").innerText = "- ₹" + discount.toFixed(0);

total.innerText = "₹" + finalTotal.toFixed(0);

}

loadCart();

</script>
</body>

</html>
