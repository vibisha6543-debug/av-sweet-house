<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Luxury Sweet Wishlist</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
  radial-gradient(circle at top left,#FFE3EC 0%,transparent 35%),
  radial-gradient(circle at bottom right,#FFECC8 0%,transparent 30%),
  linear-gradient(180deg,#FFF7FA,#FFFFFF);
  font-family:'Poppins',sans-serif;
  overflow:hidden;
  padding:20px;
}

/* MAIN CARD */

.card{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,0.72);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.5);
  border-radius:38px;
  padding:45px 28px;
  position:relative;
  overflow:hidden;
  text-align:center;

  box-shadow:
  0 10px 30px rgba(255,105,150,.12),
  0 25px 60px rgba(0,0,0,.06);
}

/* GLOW EFFECT */

.glow{
  position:absolute;
  width:220px;
  height:220px;
  background:#FFD0E0;
  border-radius:50%;
  filter:blur(60px);
  opacity:.5;
  z-index:0;
}

.glow1{
  top:-80px;
  left:-60px;
}

.glow2{
  bottom:-100px;
  right:-80px;
  background:#FFE9B5;
}

/* FLOATING HEARTS */

.float{
  position:absolute;
  color:#FF8FB2;
  opacity:.5;
  animation:float 5s infinite ease-in-out;
}

.f1{
  top:40px;
  left:30px;
  font-size:22px;
}

.f2{
  top:110px;
  right:40px;
  font-size:18px;
  animation-delay:1s;
}

.f3{
  bottom:120px;
  left:40px;
  font-size:20px;
  animation-delay:2s;
}

@keyframes float{
  0%,100%{
    transform:translateY(0px);
  }
  50%{
    transform:translateY(-10px);
  }
}

/* IMAGE AREA */

.image-wrap{
  position:relative;
  z-index:2;
}

.image-circle{
  width:150px;
  height:150px;
  margin:auto;
  border-radius:50%;
  background:
  linear-gradient(145deg,#FFD8E7,#FFABC4);

  display:flex;
  justify-content:center;
  align-items:center;

  box-shadow:
  inset 0 6px 10px rgba(255,255,255,.6),
  0 18px 30px rgba(255,120,160,.25);

  position:relative;
}

.image-circle::after{
  content:'';
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:2px dashed rgba(255,255,255,.7);
}

.image-circle span{
  font-size:72px;
  z-index:2;
}

/* TEXT */

.title{
  margin-top:28px;
  font-size:36px;
  line-height:1.2;
  font-weight:800;
  color:#2B1D1D;
  position:relative;
  z-index:2;
}

.subtitle{
  margin-top:16px;
  font-size:16px;
  line-height:1.8;
  color:#7E7070;
  position:relative;
  z-index:2;
}

.subtitle span{
  color:#FF5E92;
  font-weight:700;
}

/* SWEETS */

.sweets{
  margin-top:30px;
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
  position:relative;
  z-index:2;
}

.sweet{
  width:62px;
  height:62px;
  border-radius:20px;
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(10px);

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:30px;

  box-shadow:
  0 8px 20px rgba(0,0,0,.05);

  transition:.35s;
}

.sweet:hover{
  transform:translateY(-8px) scale(1.05);
}

/* BUTTON */

.button{
  margin-top:38px;
  width:100%;
  height:62px;
  border:none;
  border-radius:22px;

  background:
  linear-gradient(90deg,#FF74A4,#FF4C88);

  color:white;
  font-size:18px;
  font-weight:700;
  letter-spacing:.3px;

  cursor:pointer;

  box-shadow:
  0 15px 25px rgba(255,90,140,.28);

  transition:.35s;

  position:relative;
  overflow:hidden;
  z-index:2;
}

.button::before{
  content:'';
  position:absolute;
  top:0;
  left:-120%;
  width:100%;
  height:100%;
  background:rgba(255,255,255,.25);
  transform:skewX(-20deg);
  transition:.6s;
}

.button:hover::before{
  left:120%;
}

.button:hover{
  transform:translateY(-4px);
  box-shadow:
  0 20px 30px rgba(255,90,140,.35);
}

/* MOBILE */

@media(max-width:480px){

  .card{
    padding:38px 22px;
    border-radius:30px;
  }

  .title{
    font-size:30px;
  }

  .subtitle{
    font-size:15px;
  }

  .image-circle{
    width:130px;
    height:130px;
  }

  .image-circle span{
    font-size:62px;
  }

}

</style>
</head>

<body>

<div class="card">

  <div class="glow glow1"></div>
  <div class="glow glow2"></div>

  <div class="float f1">♡</div>
  <div class="float f2">✨</div>
  <div class="float f3">♡</div>

  <div class="image-wrap">

    <div class="image-circle">
      <span>🎁</span>
    </div>

  </div>

  <h1 class="title">
    No Sweet Saved Yet
  </h1>

  <p class="subtitle">
    Your <span>Future Cravings</span> are waiting to be added into your magical dessert wishlist 🍓
  </p>

  <div class="sweets">

    <div class="sweet">🍩</div>
    <div class="sweet">🧁</div>
    <div class="sweet">🍰</div>
    <div class="sweet">🍫</div>

  </div>

  <button class="button">
    ♡ Fill My Wishlist
  </button>

</div>

</body>
</html>
