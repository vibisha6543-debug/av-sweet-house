<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AV Sweet House</title>

     <!-- ===== FAVICON (Browser Tab Icon) ===== -->
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #ffe5ec 0%, transparent 30%),
                radial-gradient(circle at bottom right, #d6f6ff 0%, transparent 30%),
                #fffaf7;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .forgot-box {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            border-radius: 30px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 77, 141, 0.05);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            color: #ff4d8d;
            font-weight: 800;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .sub-text {
            color: #666;
            line-height: 1.7;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 2px solid #f0e0e0;
            outline: none;
            transition: 0.3s;
            font-size: 15px;
            background: #faf8f8;
        }

        .input-box input:focus {
            border-color: #ff4d8d;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 77, 141, 0.08);
        }

        .message-box {
            display: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
            text-align: left;
        }

        .message-box.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message-box.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff4d8d, #ff758f);
            color: white;
            padding: 15px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 77, 141, 0.25);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 77, 141, 0.35);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .back a {
            color: #ff4d8d;
            text-decoration: none;
            font-weight: 600;
        }

        .back a:hover {
            color: #ff2f78;
            text-decoration: underline;
        }

        @media(max-width: 500px) {
            .forgot-box {
                padding: 30px 20px;
            }
            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="forgot-box">

        <div class="icon">🔐</div>

        <h1>Forgot Password?</h1>

        <p class="sub-text">
            Enter your email address and we'll send you an OTP to reset your password.
        </p>

        <div id="messageBox" class="message-box"></div>

        <div class="input-box">
            <label>Email Address</label>
            <input type="email" id="emailInput" placeholder="Enter your registered email">
        </div>

        <button id="sendOtpBtn" class="btn" onclick="sendOTP()">
            <i class="fa-regular fa-paper-plane"></i> Send OTP
        </button>

        <div class="back">
            Remember your password? <a href="login.html">Login</a>
        </div>

    </div>

    <script>
        // ============================================
        // SHOW MESSAGE
        // ============================================

        function showMessage(message, type = 'error') {
            const box = document.getElementById('messageBox');
            box.textContent = message;
            box.className = 'message-box ' + type;
            box.style.display = 'block';
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.className = 'message-box';
            box.style.display = 'none';
        }

        // ============================================
        // SEND OTP
        // ============================================

        async function sendOTP() {
            const email = document.getElementById('emailInput').value.trim();
            const btn = document.getElementById('sendOtpBtn');

            hideMessage();

            if (!email) {
                showMessage('Please enter your email address.', 'error');
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('Please enter a valid email address.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner"></span> Sending OTP...`;

            console.log('📧 Sending OTP to:', email);

            try {
                const response = await fetch('http://localhost:5100/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();
                console.log('📧 Response:', data);

                if (data.success) {
                    localStorage.setItem('resetEmail', email);

                    showMessage('✅ OTP sent successfully! Please check your email.', 'success');

                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-regular fa-paper-plane"></i> Send OTP`;

                    // Redirect to OTP verification page after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'forget verify otp.html';
                    }, 3000);

                } else {
                    showMessage(data.message || 'Failed to send OTP. Please try again.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-regular fa-paper-plane"></i> Send OTP`;
                }

            } catch (error) {
                console.error('❌ Error:', error);
                showMessage('Network error. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-regular fa-paper-plane"></i> Send OTP`;
            }
        }

        // ============================================
        // ENTER KEY
        // ============================================

        document.getElementById('emailInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendOTP();
            }
        });

        console.log('🔐 Forgot Password Page Loaded');
    </script>

</body>

</html>
