<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - AV Sweet House</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #fff0f6, #ffe4f1);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .forgot-box {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 25px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .icon {
      font-size: 70px;
      margin-bottom: 15px;
    }

    h1 {
      color: #d63384;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .input-box {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-box label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 500;
    }

    .input-box input {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #ddd;
      outline: none;
      transition: 0.3s;
    }

    .input-box input:focus {
      border-color: #d63384;
      box-shadow: 0 0 5px rgba(214,51,132,0.3);
    }

    .btn {
      display: block;
      width: 100%;
      background: #d63384;
      color: white;
      padding: 14px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background: #b91c68;
    }

    .back {
      margin-top: 20px;
      font-size: 14px;
    }

    .back a {
      color: #d63384;
      text-decoration: none;
      font-weight: 600;
    }

  </style>
</head>

<body>

  <div class="forgot-box">

    <div class="icon">🔐</div>

    <h1>Forgot Password?</h1>

    <p>
      Don’t worry ❤️ Enter your email or phone number
      and we’ll send you an OTP to reset your password.
    </p>

    <!-- INPUT -->
    <div class="input-box">
      <label>Email / Phone Number</label>
      <input type="text" placeholder="Enter email or phone number">
    </div>

    <!-- BUTTON -->
    <a href="otp.html" class="btn">
      Send OTP
    </a>

    <!-- BACK -->
    <div class="back">
      Remember your password?
      <a href="login.html">Login</a>
    </div>

  </div>

</body>

</html>
