<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - AV Sweet House</title>

     <!-- ===== FAVICON (Browser Tab Icon) ===== -->
    <!-- Option 1: Simple Cake -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #ffe5ec 0%, transparent 30%),
                radial-gradient(circle at bottom right, #d6f6ff 0%, transparent 30%),
                #fffaf7;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .verify-box {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            border-radius: 30px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 77, 141, 0.05);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            color: #ff4d8d;
            font-weight: 800;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .sub-text {
            color: #666;
            line-height: 1.7;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .sub-text strong {
            color: #ff4d8d;
        }

        .input-box {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 2px solid #f0e0e0;
            outline: none;
            transition: 0.3s;
            font-size: 15px;
            background: #faf8f8;
            text-align: center;
            letter-spacing: 5px;
            font-weight: 700;
        }

        .input-box input:focus {
            border-color: #ff4d8d;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 77, 141, 0.08);
        }

        .message-box {
            display: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .message-box.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message-box.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff4d8d, #ff758f);
            color: white;
            padding: 15px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 77, 141, 0.25);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 77, 141, 0.35);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .back a {
            color: #ff4d8d;
            text-decoration: none;
            font-weight: 600;
        }

        .back a:hover {
            color: #ff2f78;
            text-decoration: underline;
        }

        .resend {
            margin-top: 12px;
            font-size: 13px;
            color: #888;
        }

        .resend a {
            color: #ff4d8d;
            cursor: pointer;
            font-weight: 600;
        }

        @media(max-width: 500px) {
            .verify-box {
                padding: 30px 20px;
            }
            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="verify-box">

        <div class="icon">🔑</div>

        <h1>Verify OTP</h1>

        <p class="sub-text">
            Enter the 6-digit OTP sent to <strong id="emailDisplay">your email</strong>
        </p>

        <div id="messageBox" class="message-box"></div>

        <div class="input-box">
            <label>Enter OTP</label>
            <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6">
        </div>

        <button id="verifyBtn" class="btn" onclick="verifyOTP()">
            <i class="fa-solid fa-check"></i> Verify OTP
        </button>

        <div class="resend">
            Didn't receive OTP? <a onclick="resendOTP()">Resend OTP</a>
        </div>

        <div class="back">
            <a href="login.html">← Back to Login</a>
        </div>

    </div>

    <script>
        // ============================================
        // GET EMAIL - ONLY FOR FORGOT PASSWORD
        // ============================================

        const resetEmail = localStorage.getItem('resetEmail');

        if (resetEmail) {
            document.getElementById('emailDisplay').textContent = resetEmail;
            console.log('📧 Email found for password reset:', resetEmail);
        } else {
            document.getElementById('emailDisplay').textContent = 'your email';
            console.log('⚠️ No email found. Please request OTP again.');
            showMessage('Email not found. Please go back and request OTP again.', 'error');
        }

        // ============================================
        // SHOW MESSAGE
        // ============================================

        function showMessage(message, type = 'error') {
            const box = document.getElementById('messageBox');
            box.textContent = message;
            box.className = 'message-box ' + type;
            box.style.display = 'block';
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.className = 'message-box';
            box.style.display = 'none';
        }

        // ============================================
        // VERIFY OTP
        // ============================================

        async function verifyOTP() {
            const otp = document.getElementById('otpInput').value.trim();
            const btn = document.getElementById('verifyBtn');
            const email = resetEmail;

            hideMessage();

            if (!email) {
                showMessage('Email not found. Please request OTP again.', 'error');
                return;
            }

            if (!otp || otp.length !== 6) {
                showMessage('Please enter a valid 6-digit OTP.', 'error');
                document.getElementById('otpInput').focus();
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner"></span> Verifying...`;

            try {
                console.log('🔐 Verifying OTP for:', email);
                console.log('🔐 OTP:', otp);

                const response = await fetch('http://localhost:5100/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, otp: otp })
                });

                const data = await response.json();
                console.log('🔐 Response:', data);

                if (data.success) {
                    showMessage('✅ OTP verified successfully! Redirecting...', 'success');

                    setTimeout(() => {
                        window.location.href = 'reset password.html';
                    }, 1500);

                } else {
                    showMessage(data.message || 'Invalid OTP. Please try again.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-check"></i> Verify OTP`;
                }

            } catch (error) {
                console.error('❌ Error:', error);
                showMessage('Network error. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Verify OTP`;
            }
        }

        // ============================================
        // RESEND OTP
        // ============================================

        async function resendOTP() {
            const email = resetEmail;

            if (!email) {
                showMessage('Email not found. Please request OTP again.', 'error');
                return;
            }

            const link = document.querySelector('.resend a');
            link.textContent = 'Sending...';
            link.style.pointerEvents = 'none';

            try {
                const response = await fetch('http://localhost:5100/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ OTP resent successfully! Check your email.', 'success');
                } else {
                    showMessage(data.message || 'Failed to resend OTP.', 'error');
                }

            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            }

            link.textContent = 'Resend OTP';
            link.style.pointerEvents = 'auto';
        }

        // ============================================
        // ENTER KEY
        // ============================================

        document.getElementById('otpInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyOTP();
            }
        });

        document.getElementById('otpInput').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            if (this.value.length === 6) {
                verifyOTP();
            }
        });

        console.log('🔐 Forgot Password - Verify OTP Page Loaded');
        console.log('📧 Email:', resetEmail);
    </script>

</body>

</html>
