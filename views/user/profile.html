
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | AV Sweet House</title>

<!-- ===== FAVICON ===== -->
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#fff0f5,#ffeef8);
min-height:100vh;
}

/* HERO */

.hero{
background:linear-gradient(135deg,#ff4d8d,#ff85b3);
padding:80px 20px;
text-align:center;
color:white;
border-radius:0 0 40px 40px;
}

.hero h1{
font-size:3rem;
font-weight:700;
}

/* PROFILE CARD */

.profile-card{
background:white;
border-radius:30px;
padding:35px;
margin-top:-50px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
text-align:center;
}

.profile-img{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:5px solid #ff4d8d;
}

.profile-name{
font-size:28px;
font-weight:700;
margin-top:15px;
}

.profile-info{
color:#666;
margin:8px 0;
}

/* BUTTONS */

.btn-pink{
background:#ff4d8d;
color:white;
border:none;
border-radius:30px;
padding:12px 25px;
font-weight:600;
}

.btn-pink:hover{
background:#ff2f78;
color:white;
}

.btn-outline-pink{
border:2px solid #ff4d8d;
color:#ff4d8d;
border-radius:30px;
padding:12px 25px;
font-weight:600;
}

.btn-outline-pink:hover{
background:#ff4d8d;
color:white;
}

/* ACTION BOXES */

.action-card{
background:white;
padding:25px;
border-radius:25px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,.08);
transition:.3s;
height:100%;
}

.action-card:hover{
transform:translateY(-6px);
}

.action-card h3{
font-size:20px;
margin-top:10px;
color:#ff4d8d;
}

.action-card p{
color:#666;
}

/* ADDRESS */

.address-card{
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
margin-top:30px;
}

.address-card h3{
color:#ff4d8d;
margin-bottom:15px;
}

</style>

</head>

<body>

<!-- HERO -->

<section class="hero">

<h1>👤 My Profile</h1>

<p>Manage your AV Sweet House account</p>

</section>

<div class="container">

<!-- PROFILE -->

<div class="profile-card">

<img
src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
class="profile-img">

<h2 class="profile-name">Vibi</h2>

<p class="profile-info">
📧 vibi@gmail.com
</p>

<p class="profile-info">
📞 +91 9876543210
</p>

<div class="mt-4">

<button class="btn btn-pink">
✏ Edit Profile
</button>

</div>

</div>

<!-- ACTIONS -->

<div class="row g-4 mt-4">

<div class="col-md-4">

<a href="my-orders.html" style="text-decoration:none;">

<div class="action-card">

<h1>📦</h1>

<h3>My Orders</h3>

<p>View your order history</p>

</div>

</a>

</div>

<div class="col-md-4">

<a href="wishlist.html" style="text-decoration:none;">

<div class="action-card">

<h1>❤️</h1>

<h3>Wishlist</h3>

<p>Your favorite products</p>

</div>

</a>

</div>

<div class="col-md-4">

<a href="cart.html" style="text-decoration:none;">

<div class="action-card">

<h1>🛒</h1>

<h3>Cart</h3>

<p>View your cart items</p>

</div>

</a>

</div>

</div>

<!-- ADDRESS -->

<div class="address-card">

<h3>📍 Delivery Address</h3>

<p>
AV Sweet House,<br>
Kollam,<br>
Kerala,<br>
India - 691001
</p>

<button class="btn btn-outline-pink mt-3">
Update Address
</button>

</div>

<!-- LOGOUT -->

<div class="text-center mt-4 mb-5">

<button class="btn btn-danger px-4 py-2 rounded-pill">
🚪 Logout
</button>

</div>

</div>

</body>
</html>
