<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupcake Offer - AV Sweet House</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#fff6fb;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:520px;
      background:white;
      border-radius:22px;
      padding:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .title{
      font-size:26px;
      font-weight:700;
      color:#d63384;
      margin-bottom:5px;
    }

    .sub{
      color:#666;
      margin-bottom:15px;
    }

    .offer-box{
      background:#fff0f6;
      padding:12px;
      border-radius:12px;
      margin-bottom:15px;
      color:#d63384;
      font-weight:600;
      text-align:center;
    }

    /* FLAVOUR */

    .section{
      margin-top:15px;
    }

    .section h3{
      margin-bottom:10px;
      color:#333;
    }

    label{
      display:block;
      margin:8px 0;
      color:#555;
    }

    /* QUANTITY */

    .qty{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:10px;
    }

    .qty button{
      width:40px;
      height:40px;
      border:none;
      background:#d63384;
      color:white;
      font-size:18px;
      border-radius:8px;
      cursor:pointer;
    }

    .qty input{
      width:60px;
      text-align:center;
      padding:8px;
      border:1px solid #ddd;
      border-radius:8px;
    }

    /* PRICE */

    .price{
      margin-top:15px;
      font-size:20px;
      font-weight:700;
      color:#d63384;
    }

    .price span{
      text-decoration:line-through;
      color:#999;
      font-size:16px;
      margin-left:10px;
    }

    .free{
      margin-top:10px;
      background:#e8fff0;
      padding:10px;
      border-radius:10px;
      color:#1a7f37;
      font-weight:600;
      text-align:center;
    }

    /* TIMER */

    .timer{
      margin-top:12px;
      background:#fff3cd;
      padding:10px;
      border-radius:10px;
      text-align:center;
      font-weight:600;
      color:#b45309;
    }

    /* BUTTONS */

    .btn{
      display:block;
      text-align:center;
      padding:14px;
      border-radius:30px;
      font-weight:600;
      text-decoration:none;
      margin-top:12px;
    }

    .cart{
      background:#d63384;
      color:white;
    }

    .buy{
      border:2px solid #d63384;
      color:#d63384;
      background:white;
    }

    .buy:hover{
      background:#d63384;
      color:white;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="title">Cupcake Offer 🧁</div>
    <div class="sub">Buy 1 Get 1 + 20% OFF</div>

    <div class="offer-box">
      🎉 Freshly baked cupcakes – Choose your favorite
    </div>

    <!-- FLAVOUR -->

    <div class="section">

      <h3>🎨 Flavor</h3>

      <label><input type="radio" name="flavor" checked> Chocolate</label>
      <label><input type="radio" name="flavor"> Vanilla</label>
      <label><input type="radio" name="flavor"> Red Velvet</label>

    </div>

    <!-- QUANTITY -->

    <div class="section">

      <h3>🔢 Quantity</h3>

      <div class="qty">
        <button>-</button>
        <input type="text" value="1">
        <button>+</button>
      </div>

    </div>

    <!-- PRICE -->

    <div class="price">
      ₹80 <span>₹120</span>
    </div>

    <div class="free">
      🎁 1 FREE cupcake included
    </div>

    <!-- TIMER -->

    <div class="timer">
      ⏰ Ends in: 02:15:30
    </div>

    <!-- BUTTONS -->

    <a href="cart.html" class="btn cart">
      Add To Cart
    </a>

    <a href="checkout.html" class="btn buy">
      Buy Now
    </a>

  </div>

</body>

</html>
