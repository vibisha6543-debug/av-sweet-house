<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | AV Sweet House</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#fff0f3,#ffe5ec,#fdf6ff);
}

.login-box{
width:420px;
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
text-align:center;
}

.logo{
font-size:45px;
margin-bottom:10px;
}

h1{
color:#ff4d8d;
margin-bottom:10px;
}

p{
color:#777;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:#fff0f3;
outline:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:#ff4d8d;
color:white;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#ff2f78;
}

</style>

</head>
<body>

<div class="login-box">

<div class="logo">🍰</div>

<h1>Admin Login</h1>

<p>AV Sweet House Admin Panel</p>

<input type="text" id="username" placeholder="Admin Username">

<input type="password" id="password" placeholder="Password">

<button onclick="loginAdmin()">
Login
</button>

</div>

<script>

function loginAdmin(){

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;

if(
username === "admin" &&
password === "admin123"
){

localStorage.setItem(
"adminLoggedIn",
"true"
);

window.location.href =
"admin-dashboard.html";

}else{

alert("Invalid Admin Credentials");

}

}

</script>

</body>
</html>
