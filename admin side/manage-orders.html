<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Orders | Admin Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fff5f8;
}

.header{
background:linear-gradient(135deg,#ff4d8d,#ff8fb3);
padding:25px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h2{
font-weight:700;
}

.logout-btn{
background:white;
color:#ff4d8d;
padding:10px 20px;
border-radius:30px;
text-decoration:none;
font-weight:600;
}

.container-box{
padding:40px;
}

.order-card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
margin-bottom:20px;
}

.status{
padding:8px 16px;
border-radius:20px;
font-size:14px;
font-weight:600;
display:inline-block;
}

.processing{
background:#fff3cd;
color:#856404;
}

.shipped{
background:#d1ecf1;
color:#0c5460;
}

.delivered{
background:#d4edda;
color:#155724;
}

.action-btn{
margin-top:10px;
}

.empty-box{
text-align:center;
padding:80px;
background:white;
border-radius:20px;
}

</style>

</head>
<body>

<div class="header">

<h2>📦 Manage Orders</h2>

<a href="admin-login.html" class="logout-btn">
Logout
</a>

</div>

<div class="container container-box">

<div id="ordersContainer"></div>

</div>

<script>

const API_URL = "http://localhost:5000/api/orders";

let orders = [];

const container =
    document.getElementById("ordersContainer");


/* =========================
   LOAD ORDERS FROM BACKEND
========================= */

async function loadOrders() {

    try {

        const response =
            await fetch(API_URL);

        const data =
            await response.json();

        console.log("Admin Orders:", data);

        /*
           Backend may return:
           { success:true, orders:[...] }
        */

        if (Array.isArray(data)) {

            orders = data;

        } else {

            orders = data.orders || [];

        }

        renderOrders();

    }
    catch(error) {

        console.error("Error loading orders:", error);

        container.innerHTML = `

            <div class="empty-box">

                <h3>❌ Failed to Load Orders</h3>

                <p>
                    Please check whether your backend
                    server is running.
                </p>

            </div>

        `;

    }

}


/* =========================
   DISPLAY ORDERS
========================= */

function renderOrders() {

    container.innerHTML = "";


    if (orders.length === 0) {

        container.innerHTML = `

            <div class="empty-box">

                <h3>
                    No Orders Found 📦
                </h3>

                <p>
                    Customer orders will appear here.
                </p>

            </div>

        `;

        return;

    }


    orders.forEach((order, index) => {


        let statusClass = "";


        if (order.status === "Pending") {

            statusClass = "processing";

        }

        else if (order.status === "Processing") {

            statusClass = "processing";

        }

        else if (order.status === "Shipped") {

            statusClass = "shipped";

        }

        else if (order.status === "Delivered") {

            statusClass = "delivered";

        }


        let total =
            Number(order.totalAmount || 0);


        let productCount =
            order.products
            ? order.products.length
            : 0;


        container.innerHTML += `

            <div class="order-card">

                <h4>
                    Order #${order._id}
                </h4>


                <p>

                    <b>Customer :</b>

                    ${order.customerName || "Guest Customer"}

                </p>


                <p>

                    <b>Email :</b>

                    ${order.email || "Not Available"}

                </p>


                <p>

                    <b>Phone :</b>

                    ${order.phone || "Not Available"}

                </p>


                <p>

                    <b>Total :</b>

                    ₹${total.toFixed(2)}

                </p>


                <p>

                    <b>Products :</b>

                    ${productCount} Items

                </p>


                <p>

                    <b>Date :</b>

                    ${
                        order.createdAt
                        ? new Date(order.createdAt).toLocaleString()
                        : "Not Available"
                    }

                </p>


                <p>

                    <b>Status :</b>

                    <span class="status ${statusClass}">

                        ${order.status || "Pending"}

                    </span>

                </p>


                <!-- STATUS -->

                <select
                    class="form-select mt-3"
                    onchange="changeStatus('${order._id}', this.value)"
                >

                    <option
                        value="Pending"
                        ${order.status === "Pending" ? "selected" : ""}
                    >
                        Pending
                    </option>


                    <option
                        value="Processing"
                        ${order.status === "Processing" ? "selected" : ""}
                    >
                        Processing
                    </option>


                    <option
                        value="Shipped"
                        ${order.status === "Shipped" ? "selected" : ""}
                    >
                        Shipped
                    </option>


                    <option
                        value="Delivered"
                        ${order.status === "Delivered" ? "selected" : ""}
                    >
                        Delivered
                    </option>


                    <option
                        value="Cancelled"
                        ${order.status === "Cancelled" ? "selected" : ""}
                    >
                        Cancelled
                    </option>

                </select>


                <!-- VIEW -->

                <button
                    class="btn btn-primary action-btn mt-3"
                    onclick="viewOrder('${order._id}')"
                >

                    View Details

                </button>


            </div>

        `;

    });

}


/* =========================
   CHANGE ORDER STATUS
========================= */

async function changeStatus(orderId, status) {

    try {

        console.log(
            "Changing status:",
            orderId,
            status
        );


        const response = await fetch(

            `${API_URL}/${orderId}`,

            {

                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    status: status

                })

            }

        );


        const data =
            await response.json();


        console.log(
            "Status update response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Status update failed"
            );

        }


        alert(
            "Order status updated to " +
            status
        );


        loadOrders();

    }

    catch(error) {

        console.error(
            "Status update error:",
            error
        );


        alert(
            "❌ Could not update order status"
        );

    }

}


/* =========================
   VIEW ORDER
========================= */

async function viewOrder(orderId) {

    console.log("Selected Order ID:", orderId);

    if (!orderId) {

        alert("Order ID not found");

        return;
    }

    try {

        const response = await fetch(
            "http://localhost:5000/api/orders/" + orderId
        );

        const fullOrder = await response.json();

        console.log(
            "Full Order From Server:",
            fullOrder
        );

        if (!response.ok) {

            alert(
                fullOrder.message ||
                "Unable to load order"
            );

            return;
        }

        localStorage.setItem(
            "selectedOrder",
            JSON.stringify(fullOrder)
        );

        window.location.href =
            "order-details.html";

    }
    catch(error) {

        console.error(
            "View Order Error:",
            error
        );

        alert(
            "Server connection failed"
        );

    }
}
/* =========================
   START
========================= */

loadOrders();

</script>

</body>
</html>
