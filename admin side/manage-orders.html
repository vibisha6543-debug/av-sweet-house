<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders | AV Sweet House Admin</title>
     <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fff5f8; overflow-x: hidden; }

        /* ============ SIDEBAR ============ */
        .sidebar {
            position: fixed; left: 0; top: 0;
            width: 250px; height: 100vh;
            background: linear-gradient(180deg, #ff4d8d, #ff7eaa);
            color: white; padding: 25px 15px;
            z-index: 1000;
            transition: all 0.3s ease;
            overflow-y: auto;
        }
        .sidebar.open { transform: translateX(0); }
        .logo { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 35px; }
        .logo span { display: block; font-size: 13px; font-weight: 400; margin-top: 5px; opacity: .9; }
        .menu { list-style: none; padding: 0; }
        .menu li { margin-bottom: 8px; }
        .menu a {
            display: flex; align-items: center; gap: 15px;
            padding: 13px 16px; color: white; text-decoration: none;
            border-radius: 12px; font-size: 14px;
            transition: .3s; cursor: pointer;
        }
        .menu a:hover, .menu a.active { background: rgba(255, 255, 255, .20); }
        .menu i { width: 20px; text-align: center; }
        .menu .badge-count {
            background: rgba(255, 255, 255, 0.25);
            padding: 2px 10px; border-radius: 20px;
            font-size: 12px; margin-left: auto;
        }

        .sidebar-toggle {
            display: none; position: fixed; top: 15px; left: 15px;
            z-index: 1001; background: #ff4d8d; color: white; border: none;
            border-radius: 10px; padding: 10px 14px;
            font-size: 20px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 141, 0.3);
        }
        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.4); z-index: 999;
        }
        .sidebar-overlay.show { display: block; }

        /* ============ MAIN ============ */
        .main { margin-left: 250px; padding: 30px; transition: all 0.3s ease; }

        .top-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; flex-wrap: wrap; gap: 15px;
        }
        .top-header h1 { font-size: 26px; font-weight: 700; color: #333; }
        .top-header p { margin: 5px 0 0; color: #777; font-size: 14px; }

        /* ============ FILTERS ============ */
        .filters-box {
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .06);
            margin-bottom: 25px;
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
        }

        /* Search input with icon inside */
        .search-wrapper {
            position: relative;
            flex: 1 1 280px;
            min-width: 220px;
        }
        .search-wrapper input {
            width: 100%;
            padding: 12px 42px 12px 42px;
            border-radius: 12px;
            border: 2px solid #f0e0e6;
            background: #faf8f9;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            color: #333;
        }
        .search-wrapper input:focus {
            border-color: #ff4d8d;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 77, 141, 0.08);
        }
        .search-wrapper input::placeholder {
            color: #aaa;
            font-weight: 400;
        }
        .search-wrapper .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #bbb;
            font-size: 15px;
            pointer-events: none;
            transition: 0.3s;
        }
        .search-wrapper input:focus ~ .search-icon {
            color: #ff4d8d;
        }
        .search-wrapper .clear-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #bbb;
            font-size: 15px;
            cursor: pointer;
            display: none;
            transition: 0.3s;
        }
        .search-wrapper .clear-icon:hover {
            color: #ff4d8d;
            transform: translateY(-50%) scale(1.2);
        }
        .search-wrapper .clear-icon.visible {
            display: block;
        }

        .filters-box select {
            padding: 12px 16px; border-radius: 12px;
            border: 2px solid #f0e0e6; background: #faf8f9;
            font-size: 14px; outline: none;
            flex: 0 1 180px;
            transition: 0.3s;
            cursor: pointer;
            font-weight: 500;
        }
        .filters-box select:focus {
            border-color: #ff4d8d; background: white;
        }

        .filter-badge {
            background: #fff0f3; color: #ff4d8d;
            padding: 12px 20px; border-radius: 12px;
            font-weight: 600; font-size: 14px;
            white-space: nowrap;
        }
        .clear-btn {
            background: #f8f0f3; color: #ff4d8d;
            border: none; border-radius: 12px;
            padding: 12px 18px;
            font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 6px;
            white-space: nowrap;
        }
        .clear-btn:hover { background: #ff4d8d; color: white; }

        /* ============ ORDER CARD ============ */
        .order-card {
            background: white; border-radius: 20px; padding: 22px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .06);
            margin-bottom: 18px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 77, 141, 0.05);
        }
        .order-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .order-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; flex-wrap: wrap;
            gap: 10px; padding-bottom: 15px;
            border-bottom: 1px dashed #f5e0e6;
            margin-bottom: 15px;
        }
        .order-id {
            font-size: 15px; font-weight: 700; color: #333;
            display: flex; align-items: center; gap: 8px;
        }
        .order-id i { color: #ff4d8d; }
        .order-date { font-size: 12px; color: #999; margin-top: 4px; }

        .order-info-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px; margin-bottom: 15px;
        }
        .info-item {
            display: flex; flex-direction: column; gap: 4px;
            font-size: 13px;
        }
        .info-item .label { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-item .value { color: #333; font-weight: 600; word-break: break-word; }

        /* ============ STATUS ============ */
        .status {
            padding: 6px 16px; border-radius: 30px;
            font-size: 12px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.3px;
            display: inline-block;
        }
        .status.pending { background: #fff3cd; color: #856404; }
        .status.processing { background: #eee4ff; color: #7048c4; }
        .status.shipped { background: #dff5ff; color: #147da9; }
        .status.delivered { background: #d4edda; color: #155724; }
        .status.cancelled { background: #f8d7da; color: #721c24; }

        /* ============ ACTIONS ============ */
        .order-actions {
            display: flex; gap: 12px; flex-wrap: wrap;
            align-items: center; margin-top: 15px;
            padding-top: 15px; border-top: 1px dashed #f5e0e6;
        }
        .status-select {
            padding: 10px 16px; border-radius: 12px;
            border: 2px solid #f0e0e6; background: white;
            font-weight: 600; font-size: 13px;
            cursor: pointer; outline: none;
            transition: 0.3s; flex: 1 1 200px;
            max-width: 250px;
        }
        .status-select:focus { border-color: #ff4d8d; }

        .btn-view {
            background: #ff4d8d; color: white; border: none;
            padding: 10px 24px; border-radius: 30px;
            font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-view:hover {
            background: #ff2f78; transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 77, 141, 0.3);
        }

        /* ============ EMPTY ============ */
        .empty-box {
            text-align: center; padding: 80px 30px;
            background: white; border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .06);
        }
        .empty-box i { font-size: 60px; color: #ffd2dc; margin-bottom: 20px; }
        .empty-box h3 { color: #333; margin-bottom: 8px; }
        .empty-box p { color: #888; }

        /* ============ LOADING ============ */
        .loading-box { text-align: center; padding: 60px; }
        .spinner {
            width: 45px; height: 45px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff4d8d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ============ TOAST ============ */
        .toast-notification {
            position: fixed; top: 20px; right: 20px;
            background: white; padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border-left: 4px solid #ff4d8d;
            z-index: 9999;
            display: none;
            min-width: 280px; max-width: 400px;
            animation: slideIn 0.3s ease;
        }
        .toast-notification.show { display: block; }
        .toast-notification.success { border-left-color: #28a745; }
        .toast-notification.error { border-left-color: #dc3545; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ============ RESPONSIVE ============ */
        @media(max-width: 768px) {
            .sidebar-toggle { display: block; }
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 20px 15px; padding-top: 70px; }
            .top-header h1 { font-size: 20px; }
            .order-card { padding: 16px; }
            .order-actions { flex-direction: column; align-items: stretch; }
            .status-select, .btn-view { width: 100%; max-width: none; }
            .search-wrapper { flex: 1 1 100%; }
            .filters-box select { flex: 1 1 100%; }
        }
    </style>
</head>

<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <button class="sidebar-toggle" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            🍰 AV Sweet House
            <span>Admin Panel</span>
        </div>

        <ul class="menu">
            <li><a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a></li>
            <li><a href="manage-orders.html" class="active"><i class="fa-solid fa-box"></i><span>Manage Orders</span><span class="badge-count" id="orderBadge">0</span></a></li>
            <li><a href="manage-products.html"><i class="fa-solid fa-cake-candles"></i><span>Manage Products</span></a></li>
            <li><a href="manage-categories.html"><i class="fa-solid fa-tags"></i><span>Categories</span></a></li>
            <li><a href="add-product.html"><i class="fa-solid fa-plus"></i><span>Add Product</span></a></li>
            <li><a href="customers.html"><i class="fa-solid fa-users"></i><span>Customers</span></a></li>
            <li><a href="sales-reports.html"><i class="fa-solid fa-chart-line"></i><span>Sales Report</span></a></li>
            <li style="margin-top:25px;">
                <a href="admin-login.html" onclick="logoutAdmin(event)">
                    <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- ============ TOAST ============ -->
    <div class="toast-notification" id="toast">
        <div id="toastMessage">Success!</div>
    </div>

    <!-- ============ MAIN ============ -->
    <main class="main">

        <div class="top-header">
            <div>
                <h1>📦 Manage Orders</h1>
                <p>View, filter, and update customer orders</p>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-box">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by Order ID, customer, phone, or email..."
                    oninput="applyFilters(); toggleClearIcon();"
                    autocomplete="off"
                >
                <i class="fa-solid fa-xmark clear-icon" id="clearIcon" onclick="clearSearch()" title="Clear search"></i>
            </div>

            <select id="statusFilter" onchange="applyFilters()">
                <option value="">All Status</option>
                <option value="Pending">Pending</option>
                <option value="Processing">Processing</option>
                <option value="Shipped">Shipped</option>
                <option value="Delivered">Delivered</option>
                <option value="Cancelled">Cancelled</option>
            </select>

            <button class="clear-btn" onclick="clearFilters()">
                <i class="fa-solid fa-xmark"></i> Clear
            </button>

            <span class="filter-badge" id="resultCount">0 orders</span>
        </div>

        <!-- Orders Container -->
        <div id="ordersContainer">
            <div class="loading-box">
                <div class="spinner"></div>
                <p style="color:#888;">Loading orders...</p>
            </div>
        </div>

    </main>

    <script>
        const API_URL = "http://localhost:5000/api";
        let allOrders = [];
        let filteredOrders = [];

        /* ============ AUTH CHECK ============ */
        function checkAdminLogin() {
            const isLoggedIn = localStorage.getItem("adminLoggedIn");
            const adminUser = localStorage.getItem("adminUser");

            if (isLoggedIn !== "true" || !adminUser) {
                alert("⚠️ Please login first.");
                window.location.href = "admin-login.html";
                return false;
            }
            return true;
        }

        /* ============ SIDEBAR ============ */
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        /* ============ LOGOUT ============ */
        function logoutAdmin(e) {
            if (e) e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem("adminLoggedIn");
                localStorage.removeItem("adminUser");
                localStorage.removeItem("adminName");
                localStorage.removeItem("adminLoginTime");
                window.location.href = "admin-login.html";
            }
            return false;
        }

        /* ============ TOAST ============ */
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toast.className = 'toast-notification show ' + type;
            toastMsg.textContent = message;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        /* ============ LOAD ORDERS ============ */
        async function loadOrders(isSilent = false) {
            try {
                const response = await fetch(`${API_URL}/orders`);
                if (!response.ok) throw new Error("Failed to fetch orders");

                const data = await response.json();
                allOrders = Array.isArray(data) ? data : (data.orders || []);

                console.log("📦 Orders loaded:", allOrders.length);

                document.getElementById('orderBadge').innerText = allOrders.length;

                // Preserve filters on refresh
                applyFilters();

            } catch (error) {
                console.error("Load Orders Error:", error);

                if (!isSilent) {
                    document.getElementById('ordersContainer').innerHTML = `
                        <div class="empty-box">
                            <i class="fa-solid fa-circle-exclamation" style="color:#dc3545;"></i>
                            <h3>Failed to Load Orders</h3>
                            <p>${error.message}</p>
                            <button class="btn-view mt-3" onclick="loadOrders()">
                                <i class="fa-solid fa-sync"></i> Retry
                            </button>
                        </div>
                    `;
                }
            }
        }

        /* ============ FILTERS ============ */
        function applyFilters() {
            const searchEl = document.getElementById('searchInput');
            const statusEl = document.getElementById('statusFilter');

            if (!searchEl || !statusEl) return;

            const search = searchEl.value.toLowerCase().trim();
            const status = statusEl.value;

            filteredOrders = allOrders.filter(order => {
                if (status && order.status !== status) return false;

                if (search) {
                    const orderId = String(order._id || '').toLowerCase();
                    const customerName = String(order.customerName || '').toLowerCase();
                    const phone = String(order.phone || '').toLowerCase();
                    const email = String(order.email || '').toLowerCase();

                    const matches =
                        orderId.includes(search) ||
                        customerName.includes(search) ||
                        phone.includes(search) ||
                        email.includes(search);

                    if (!matches) return false;
                }

                return true;
            });

            renderOrders();
        }

        /* ============ CLEAR SEARCH (X icon) ============ */
        function toggleClearIcon() {
            const input = document.getElementById('searchInput');
            const clearIcon = document.getElementById('clearIcon');

            if (input.value.trim().length > 0) {
                clearIcon.classList.add('visible');
            } else {
                clearIcon.classList.remove('visible');
            }
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            toggleClearIcon();
            applyFilters();
            input.focus();
        }

        /* ============ CLEAR ALL FILTERS ============ */
        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = '';
            toggleClearIcon();
            applyFilters();
            showToast('🔄 Filters cleared', 'success');
        }

        /* ============ RENDER ORDERS ============ */
        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const resultCount = document.getElementById('resultCount');

            resultCount.innerText = `${filteredOrders.length} order${filteredOrders.length !== 1 ? 's' : ''}`;

            if (filteredOrders.length === 0) {
                const isFiltering = document.getElementById('searchInput').value.trim() ||
                                     document.getElementById('statusFilter').value;

                container.innerHTML = `
                    <div class="empty-box">
                        <i class="fa-solid fa-box-open"></i>
                        <h3>${isFiltering ? 'No Matching Orders' : 'No Orders Found'}</h3>
                        <p>${allOrders.length === 0 ? 'Customer orders will appear here.' : 'Try changing the filters above.'}</p>
                        ${isFiltering ? `
                            <button class="btn-view mt-3" onclick="clearFilters()">
                                <i class="fa-solid fa-xmark"></i> Clear Filters
                            </button>
                        ` : ''}
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredOrders.map(order => {
                const status = order.status || "Pending";
                const statusClass = status.toLowerCase();
                const total = Number(order.totalAmount || 0);
                const productCount = order.products ? order.products.length : 0;
                const orderId = String(order._id || '');
                const shortId = orderId.slice(-8).toUpperCase();

                const date = order.createdAt
                    ? new Date(order.createdAt).toLocaleString('en-IN', {
                        day: '2-digit', month: 'short', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    })
                    : 'N/A';

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <div class="order-id">
                                    <i class="fa-solid fa-receipt"></i>
                                    Order #${shortId}
                                </div>
                                <div class="order-date">📅 ${date}</div>
                            </div>
                            <span class="status ${statusClass}">${status}</span>
                        </div>

                        <div class="order-info-grid">
                            <div class="info-item">
                                <span class="label">Customer</span>
                                <span class="value">👤 ${order.customerName || 'Guest'}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Phone</span>
                                <span class="value">📞 ${order.phone || 'N/A'}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Email</span>
                                <span class="value">📧 ${order.email || 'N/A'}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Products</span>
                                <span class="value">🛒 ${productCount} item${productCount !== 1 ? 's' : ''}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Total Amount</span>
                                <span class="value" style="color:#ff4d8d;font-size:15px;">₹${total.toFixed(2)}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Payment</span>
                                <span class="value">💳 ${order.paymentMethod || 'N/A'}</span>
                            </div>
                        </div>

                        <div class="order-actions">
                            <select class="status-select" onchange="changeStatus('${orderId}', this.value)">
                                <option value="Pending"     ${status === 'Pending'     ? 'selected' : ''}>⏳ Pending</option>
                                <option value="Processing"  ${status === 'Processing'  ? 'selected' : ''}>⚙️ Processing</option>
                                <option value="Shipped"     ${status === 'Shipped'     ? 'selected' : ''}>🚚 Shipped</option>
                                <option value="Delivered"   ${status === 'Delivered'   ? 'selected' : ''}>✅ Delivered</option>
                                <option value="Cancelled"   ${status === 'Cancelled'   ? 'selected' : ''}>❌ Cancelled</option>
                            </select>

                            <button class="btn-view" onclick="viewOrder('${orderId}')">
                                <i class="fa-solid fa-eye"></i> View Details
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* ============ CHANGE STATUS ============ */
        async function changeStatus(orderId, status) {
            if (!orderId || !status) return;

            console.log("🔄 Changing status:", orderId, "→", status);

            try {
                const response = await fetch(`${API_URL}/orders/${orderId}/status`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ status: status })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Status update failed");
                }

                const order = allOrders.find(o => String(o._id) === String(orderId));
                if (order) order.status = status;

                showToast(`✅ Order status changed to "${status}"`, 'success');

                applyFilters();

            } catch (error) {
                console.error("Status update error:", error);
                showToast(`❌ Failed: ${error.message}`, 'error');
                loadOrders(true);
            }
        }

        /* ============ VIEW ORDER ============ */
        async function viewOrder(orderId) {
            if (!orderId) {
                showToast("❌ Invalid order ID", 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/orders/${orderId}`);
                const fullOrder = await response.json();

                if (!response.ok) {
                    throw new Error(fullOrder.message || "Unable to load order");
                }

                console.log("📄 Order details:", fullOrder);
                localStorage.setItem("selectedOrder", JSON.stringify(fullOrder));
                window.location.href = "order-details.html";

            } catch (error) {
                console.error("View Order Error:", error);
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        /* ============ AUTO REFRESH (SILENT) ============ */
        setInterval(() => {
            if (!document.hidden) {
                loadOrders(true);
            }
        }, 30000);

        /* ============ KEYBOARD SHORTCUTS ============ */
        document.addEventListener('keydown', function (e) {
            // "/" focuses search box
            if (e.key === '/' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'SELECT') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }

            // Escape clears search when focused
            if (e.key === 'Escape' && document.activeElement.id === 'searchInput') {
                clearSearch();
            }
        });

        /* ============ INIT ============ */
        document.addEventListener('DOMContentLoaded', function () {
            if (!checkAdminLogin()) return;
            loadOrders();
            console.log('✅ Manage Orders page ready');
        });
    </script>

</body>
</html>
