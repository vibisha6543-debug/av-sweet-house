<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | AV Sweet House Admin</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #fff5f8;
            min-height: 100vh;
            padding: 0;
        }

        .header {
            background: linear-gradient(135deg, #ff4d8d, #ff9ec6);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(255, 77, 141, 0.2);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .back-btn {
            text-decoration: none;
            background: white;
            color: #ff4d8d;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 2px solid transparent;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-color: white;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 35px 40px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 77, 141, 0.05);
        }

        .container h2 {
            text-align: center;
            color: #ff4d8d;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 700;
        }

        .container .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group { margin-bottom: 22px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }

        .form-group label .required { color: #dc3545; margin-left: 3px; }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f8f0f3;
            border-radius: 14px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .form-group .input-wrapper:focus-within {
            border-color: #ff4d8d;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 77, 141, 0.08);
        }

        .form-group .input-wrapper .input-icon {
            padding: 0 0 0 16px;
            color: #999;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group .input-wrapper:focus-within .input-icon { color: #ff4d8d; }

        .form-group .input-wrapper input,
        .form-group .input-wrapper select {
            width: 100%;
            padding: 14px 16px 14px 12px;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            color: #333;
            font-weight: 500;
            appearance: none;
            -webkit-appearance: none;
        }

        .form-group .input-wrapper select { cursor: pointer; }

        .form-group .input-wrapper .select-arrow {
            padding-right: 16px;
            color: #999;
            pointer-events: none;
        }

        .form-group .input-wrapper input::placeholder {
            color: #aaa;
            font-weight: 400;
        }

        .form-group .error-text {
            color: #dc3545;
            font-size: 12px;
            font-weight: 500;
            margin-top: 6px;
            display: none;
            align-items: center;
            gap: 5px;
        }

        .form-group .error-text.show { display: flex; }

        .form-group .char-count {
            font-size: 12px;
            color: #999;
            text-align: right;
            margin-top: 4px;
        }

        .preview-section {
            margin-top: 20px;
            padding: 20px;
            background: #f8f0f3;
            border-radius: 16px;
            text-align: center;
            border: 2px dashed #ddd;
            transition: all 0.3s ease;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .preview-section.has-image {
            border-color: #ff4d8d;
            border-style: solid;
            background: #fff5f8;
        }

        .preview-section .placeholder-text {
            color: #aaa;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .preview-section .placeholder-text i { font-size: 40px; color: #ddd; }

        .preview-section img {
            max-width: 200px;
            max-height: 200px;
            object-fit: cover;
            border-radius: 16px;
            border: 3px solid #ff4d8d;
            display: none;
            box-shadow: 0 8px 25px rgba(255, 77, 141, 0.15);
        }

        .preview-section img.show { display: block; }

        .add-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff4d8d, #ff7eaa);
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
            position: relative;
            overflow: hidden;
        }

        .add-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255, 77, 141, 0.35); }
        .add-btn:active { transform: scale(0.98); }
        .add-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none !important; }

        .add-btn .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .add-btn.loading .spinner { display: inline-block; }
        .add-btn.loading .btn-text { display: none; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 14px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: none;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            max-width: 450px;
            animation: slideDown 0.4s ease;
        }

        .toast.show { display: flex; }
        .toast.success { background: linear-gradient(135deg, #28a745, #20c997); }
        .toast.error { background: linear-gradient(135deg, #dc3545, #e74c3c); }

        @keyframes slideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media(max-width: 768px) {
            .header { padding: 15px 20px; flex-direction: column; text-align: center; }
            .header h1 { font-size: 22px; justify-content: center; }
            .header-actions { justify-content: center; }
            .container { margin: 20px 15px; padding: 25px 20px; border-radius: 20px; }
            .container h2 { font-size: 20px; }
            .form-group .input-wrapper input,
            .form-group .input-wrapper select { padding: 12px 14px 12px 10px; font-size: 13px; }
            .toast { top: 15px; right: 15px; left: 15px; min-width: auto; padding: 14px 18px; font-size: 13px; }
        }

        @media(max-width: 480px) {
            .header h1 { font-size: 18px; }
            .back-btn { font-size: 12px; padding: 8px 16px; }
            .container { padding: 20px 15px; margin: 15px 10px; }
            .form-group { margin-bottom: 16px; }
            .form-group .input-wrapper input,
            .form-group .input-wrapper select { padding: 10px 12px 10px 8px; font-size: 12px; }
            .add-btn { font-size: 15px; padding: 14px; }
            .preview-section { min-height: 120px; padding: 15px; }
            .preview-section img { max-width: 120px; max-height: 120px; }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>
            <i class="fa-solid fa-plus-circle"></i>
            Add Product
        </h1>
        <div class="header-actions">
            <a href="manage-products.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Manage Products
            </a>
        </div>
    </header>

    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <div class="container">

        <h2>🍰 Add New Product</h2>
        <p class="subtitle">Fill in the details below to add a new product to your store</p>

        <form id="productForm" onsubmit="handleAddProduct(event)">

            <!-- Product Name -->
            <div class="form-group">
                <label for="name">Product Name <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-regular fa-tag"></i></span>
                    <input type="text" id="name" placeholder="Enter product name" maxlength="100" required>
                </div>
                <div class="char-count"><span id="nameCount">0</span>/100</div>
                <div class="error-text" id="nameError">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    Product name is required
                </div>
            </div>

            <!-- Price -->
            <div class="form-group">
                <label for="price">Price (₹) <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-solid fa-indian-rupee-sign"></i></span>
                    <input type="number" id="price" placeholder="Enter price (e.g. 499)" min="0" step="1" required>
                </div>
                <div class="error-text" id="priceError">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    Please enter a valid price
                </div>
            </div>

            <!-- Category -->
            <div class="form-group">
                <label for="category">Category <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-regular fa-layer-group"></i></span>
                    <select id="category" required>
                        <option value="">Loading categories...</option>
                    </select>
                    <span class="select-arrow"><i class="fa-solid fa-chevron-down"></i></span>
                </div>
                <div style="font-size:12px;color:#888;margin-top:5px;">
                    <i class="fa-regular fa-circle-info"></i>
                    Categories are loaded from the database (MongoDB)
                </div>
                <div class="error-text" id="categoryError">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    Please select a category
                </div>
            </div>

            <!-- Image URL -->
            <div class="form-group">
                <label for="image">
                    Image URL
                    <span style="font-weight:400;color:#888;font-size:12px;">(optional)</span>
                </label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-regular fa-image"></i></span>
                    <input type="text" id="image" placeholder="Paste image URL" oninput="previewImage()">
                </div>
            </div>

            <!-- Image Preview -->
            <div class="preview-section" id="previewSection">
                <div class="placeholder-text" id="placeholderText">
                    <i class="fa-regular fa-image"></i>
                    <span>Image preview will appear here</span>
                </div>
                <img id="previewImg" alt="Product preview">
            </div>

            <button type="submit" class="add-btn" id="addBtn">
                <span class="spinner"></span>
                <span class="btn-text">
                    <i class="fa-solid fa-save"></i>
                    Save Product
                </span>
            </button>

        </form>

    </div>

    <script>
        const API_URL = "http://localhost:5000/api";

        /* ============================================
           ADMIN AUTH CHECK
        ============================================ */
        if (localStorage.getItem("adminLoggedIn") !== "true") {
            alert("⚠️ Please login first.");
            window.location.href = "admin-login.html";
        }

        /* =====================================================
           ✅ FETCH CATEGORIES FROM DATABASE
        ===================================================== */
        async function fetchCategories() {
            try {
                const response = await fetch(`${API_URL}/categories`);
                if (!response.ok) throw new Error("Failed to load categories");
                const categories = await response.json();
                return Array.isArray(categories) ? categories : [];
            } catch (error) {
                console.error("Fetch Categories Error:", error);
                return [];
            }
        }

        async function populateCategories() {
            const categories = await fetchCategories();
            const select = document.getElementById('category');

            const mainCats = categories.filter(c => c.type === 'main');
            const subCats = categories.filter(c => c.type === 'sub');

            select.innerHTML = '<option value="">Select Category</option>';

            // Main Categories
            if (mainCats.length > 0) {
                const mainGroup = document.createElement('optgroup');
                mainGroup.label = '⭐ Main Categories';

                mainCats.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.name;
                    option.textContent = (cat.icon || '') + ' ' + cat.name;
                    option.style.fontWeight = 'bold';
                    mainGroup.appendChild(option);
                });
                select.appendChild(mainGroup);
            }

            // Subcategories grouped by parent
            if (subCats.length > 0) {
                const grouped = {};
                subCats.forEach(cat => {
                    const parent = cat.parent || 'Other';
                    if (!grouped[parent]) grouped[parent] = [];
                    grouped[parent].push(cat);
                });

                Object.keys(grouped).forEach(parent => {
                    const group = document.createElement('optgroup');
                    group.label = '📎 ' + parent;
                    grouped[parent].forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat.name;
                        option.textContent = '  └─ ' + (cat.icon || '') + ' ' + cat.name;
                        group.appendChild(option);
                    });
                    select.appendChild(group);
                });
            }

            console.log('✅ Categories loaded from DB:', categories.length);
        }

        /* ============================================
           TOAST NOTIFICATION
        ============================================ */
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toast.className = 'toast show ' + type;
            toastMsg.textContent = message;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        /* ============================================
           IMAGE PREVIEW (FIXED - no external placeholder)
        ============================================ */
        function previewImage() {
            const url = document.getElementById('image').value.trim();
            const img = document.getElementById('previewImg');
            const section = document.getElementById('previewSection');
            const placeholder = document.getElementById('placeholderText');

            if (url) {
                img.onerror = function() {
                    img.className = '';
                    section.classList.remove('has-image');
                    placeholder.style.display = 'flex';
                    placeholder.innerHTML = `
                        <i class="fa-solid fa-triangle-exclamation" style="color:#dc3545;"></i>
                        <span style="color:#dc3545;">Invalid image URL</span>
                    `;
                    img.onerror = null;
                };

                img.onload = function() {
                    placeholder.style.display = 'none';
                };

                img.src = url;
                img.className = 'show';
                section.classList.add('has-image');
                placeholder.style.display = 'none';
            } else {
                img.className = '';
                section.classList.remove('has-image');
                placeholder.style.display = 'flex';
                placeholder.innerHTML = `
                    <i class="fa-regular fa-image"></i>
                    <span>Image preview will appear here</span>
                `;
            }
        }

        /* ============================================
           CHARACTER COUNTER
        ============================================ */
        document.getElementById('name').addEventListener('input', function () {
            document.getElementById('nameCount').textContent = this.value.length;
        });

        /* ============================================
           HANDLE ADD PRODUCT
        ============================================ */
        async function handleAddProduct(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const price = document.getElementById('price').value.trim();
            const category = document.getElementById('category').value;
            const image = document.getElementById('image').value.trim();

            // Hide previous errors
            document.querySelectorAll('.error-text').forEach(el => el.classList.remove('show'));

            let hasError = false;

            if (!name) {
                document.getElementById('nameError').classList.add('show');
                hasError = true;
            }

            if (!price || isNaN(price) || Number(price) <= 0) {
                document.getElementById('priceError').classList.add('show');
                hasError = true;
            }

            if (!category) {
                document.getElementById('categoryError').classList.add('show');
                hasError = true;
            }

            if (hasError) {
                showToast('Please fill all required fields correctly', 'error');
                return;
            }

            // ✅ No external placeholder — use empty string, admin page will show fallback
            const product = {
                name: name,
                price: Number(price),
                category: category,
                image: image || ''
            };

            const addBtn = document.getElementById('addBtn');
            addBtn.classList.add('loading');
            addBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(product)
                });

                const data = await response.json();

                if (data.success || response.ok) {
                    showToast('✅ Product added successfully!', 'success');

                    // Reset form
                    document.getElementById('productForm').reset();
                    document.getElementById('nameCount').textContent = '0';
                    document.getElementById('previewImg').className = '';
                    document.getElementById('previewSection').classList.remove('has-image');
                    document.getElementById('placeholderText').style.display = 'flex';
                    document.getElementById('placeholderText').innerHTML = `
                        <i class="fa-regular fa-image"></i>
                        <span>Image preview will appear here</span>
                    `;

                    setTimeout(() => {
                        window.location.href = 'manage-products.html';
                    }, 1500);
                } else {
                    showToast('❌ ' + (data.message || 'Failed to add product'), 'error');
                }
            } catch (error) {
                console.error('Add Product Error:', error);
                showToast('⚠️ Server not running! Please start your server on port 5000.', 'error');
            } finally {
                addBtn.classList.remove('loading');
                addBtn.disabled = false;
            }
        }

        /* ============================================
           KEYBOARD SHORTCUT (Ctrl+Enter = Submit)
        ============================================ */
        document.addEventListener('keydown', function (e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                const form = document.getElementById('productForm');
                if (form.requestSubmit) {
                    form.requestSubmit();
                } else {
                    form.dispatchEvent(new Event('submit', { cancelable: true }));
                }
            }
        });

        /* ============================================
           INIT
        ============================================ */
        document.addEventListener('DOMContentLoaded', async function () {
            // ✅ Populate categories from DATABASE
            await populateCategories();
            console.log('✅ Add Product page loaded');
            console.log('📌 Ctrl+Enter to submit');
        });
    </script>

</body>

</html>
