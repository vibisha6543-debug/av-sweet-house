<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customers | AV Sweet House</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fff5f8;
}

/* HEADER */

.header{
background:linear-gradient(135deg,#ff4d8d,#ff9ec6);
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

.header h1{
font-size:30px;
font-weight:700;
}

.top-buttons{
display:flex;
gap:12px;
}

.btn{
padding:12px 22px;
border-radius:30px;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.btn-dashboard{
background:white;
color:#ff4d8d;
}

.btn-dashboard:hover{
transform:translateY(-2px);
}

/* CONTAINER */

.container{
padding:40px;
}

/* SEARCH */

.search-box{
margin-bottom:25px;
}

.search-box input{
width:100%;
padding:15px 20px;
border:2px solid #ffd6e6;
border-radius:15px;
font-size:16px;
outline:none;
}

.search-box input:focus{
border-color:#ff4d8d;
}

/* TABLE */

.table-wrapper{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.08);
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

thead{
background:#ff4d8d;
color:white;
}

th,
td{
padding:18px;
text-align:left;
}

tbody tr{
border-bottom:1px solid #eee;
}

tbody tr:hover{
background:#fff8fb;
}

.delete-btn{
background:#ff4d8d;
color:white;
border:none;
padding:10px 18px;
border-radius:25px;
cursor:pointer;
font-weight:600;
transition:.3s;
}

.delete-btn:hover{
background:#ff2f78;
}

/* EMPTY */

.empty{
display:none;
text-align:center;
padding:60px;
font-size:20px;
color:#888;
}

/* MOBILE */

@media(max-width:768px){

.header{
flex-direction:column;
gap:15px;
}

th,
td{
padding:12px;
font-size:14px;
}

}

</style>

</head>

<body>

<div class="header">

<h1>👥 Customers</h1>

<div class="top-buttons">

<a href="admin-dashboard.html"
class="btn btn-dashboard">

← Dashboard

</a>

</div>

</div>

<div class="container">

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="🔍 Search by Name or Email..."
onkeyup="loadCustomers()">

</div>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Action</th>

</tr>

</thead>

<tbody id="customersTable">

</tbody>

</table>

</div>

<div
id="emptyMessage"
class="empty">

No Customers Found 👤

</div>

<script>

let customersTable =
document.getElementById("customersTable");

let emptyMessage =
document.getElementById("emptyMessage");

function loadCustomers(){

    let keyword =
    document.getElementById("searchInput")
    .value
    .toLowerCase();

    let users =
    JSON.parse(localStorage.getItem("users")) || [];

    customersTable.innerHTML = "";

    if(users.length === 0){

        emptyMessage.style.display = "block";

        return;

    }

    let filteredUsers = users.filter(user=>{

        let fullName =
        (user.firstName + " " + user.lastName)
        .toLowerCase();

        let email =
        user.email.toLowerCase();

        return fullName.includes(keyword) ||
               email.includes(keyword);

    });

    if(filteredUsers.length === 0){

        emptyMessage.style.display = "block";

        return;

    }

    emptyMessage.style.display = "none";

    filteredUsers.forEach((user,index)=>{

        customersTable.innerHTML += `

        <tr>

        <td>

        ${user.firstName} ${user.lastName}

        </td>

        <td>

        ${user.email}

        </td>

        <td>

        ${user.phone}

        </td>

        <td>

        <button
        class="delete-btn"
        onclick="deleteCustomer(${index})">

        Delete

        </button>

        </td>

        </tr>

        `;

    });

}

function deleteCustomer(index){

    if(confirm("Are you sure you want to delete this customer?")){

        let users =
        JSON.parse(localStorage.getItem("users")) || [];

        users.splice(index,1);

        localStorage.setItem(
            "users",
            JSON.stringify(users)
        );

        alert("Customer deleted successfully.");

        loadCustomers();

    }

}

loadCustomers();

</script>

</body>

</html>
