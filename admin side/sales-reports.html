<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sales Reports | AV Sweet House</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fff5f8;
}

/* HEADER */

.header{

background:linear-gradient(135deg,#ff4d8d,#ff8fb3);

padding:25px;

display:flex;

justify-content:space-between;

align-items:center;

color:white;

}

.header h2{

font-weight:700;

}

.back-btn{

background:white;

color:#ff4d8d;

padding:10px 22px;

border-radius:30px;

text-decoration:none;

font-weight:600;

}

/* MAIN */

.container-box{

padding:40px;

}

/* CARDS */

.report-card{

background:white;

border-radius:20px;

padding:25px;

box-shadow:0 8px 20px rgba(0,0,0,.08);

text-align:center;

transition:.3s;

}

.report-card:hover{

transform:translateY(-6px);

}

.report-card h5{

color:#777;

margin-bottom:10px;

}

.report-card h2{

color:#ff4d8d;

font-weight:700;

}

/* PANELS */

.panel{

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 8px 20px rgba(0,0,0,.08);

margin-top:30px;

}

.panel h4{

font-weight:700;

margin-bottom:20px;

color:#ff4d8d;

}

.action-btn{

border:none;

padding:12px 25px;

border-radius:30px;

font-weight:600;

margin-right:10px;

}

.print-btn{

background:#10b981;

color:white;

}

.download-btn{

background:#3b82f6;

color:white;

}

</style>

</head>

<body>

<div class="header">

<h2>📊 Sales Reports</h2>

<a href="admin-dashboard.html" class="back-btn">

← Dashboard

</a>

</div>

<div class="container container-box">

<div class="row g-4">

<div class="col-md-3">

<div class="report-card">

<h5>Total Revenue</h5>

<h2 id="totalRevenue">₹0</h2>

</div>

</div>

<div class="col-md-3">

<div class="report-card">

<h5>Total Orders</h5>

<h2 id="totalOrders">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="report-card">

<h5>Total Customers</h5>

<h2 id="totalCustomers">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="report-card">

<h5>Total Products</h5>

<h2 id="totalProducts">0</h2>

</div>

</div>

</div>

<div class="panel">

<h4>📈 Monthly Sales</h4>

<canvas id="salesChart"></canvas>

</div>

<div class="panel">

<h4>🏆 Top Selling Products</h4>

<table class="table">

<thead>

<tr>

<th>Product</th>

<th>Sold Qty</th>

<th>Revenue</th>

</tr>

</thead>

<tbody id="productTable">

</tbody>

</table>

</div>
<div class="panel">

<h4>🥇 Top Customers</h4>
<div class="panel">

<h4>📋 Recent Transactions</h4>

<table class="table">

<thead>

<tr>

<th>Order ID</th>

<th>Customer</th>

<th>Total</th>

<th>Status</th>

</tr>

</thead>

<tbody id="transactionTable">

</tbody>

</table>

</div>

<table class="table">

<thead>

<tr>

<th>Customer</th>

<th>Email</th>

<th>Total Orders</th>

<th>Total Spent</th>

</tr>

</thead>

<tbody id="customerTable">

</tbody>

</table>

</div>

<div class="panel">

<button class="action-btn print-btn" onclick="window.print()">

🖨 Print Report

</button>

<button
class="action-btn download-btn"
onclick="downloadReport()">

📥 Download Report

</button>

</div>

</div>
<script>

/* LOAD DATA */

let products =
JSON.parse(localStorage.getItem("products")) || [];

let orders =
JSON.parse(localStorage.getItem("orders")) || [];

let users =
JSON.parse(localStorage.getItem("users")) || [];

/* ===========================
   SUMMARY
=========================== */

let revenue = 0;

orders.forEach(order=>{

    revenue += Number(order.total || 0);

});

document.getElementById("totalRevenue").innerHTML =
"₹"+revenue;

document.getElementById("totalOrders").innerHTML =
orders.length;

document.getElementById("totalCustomers").innerHTML =
users.length;

document.getElementById("totalProducts").innerHTML =
products.length;

/* ===========================
   TOP PRODUCTS
=========================== */

let productSales = {};

orders.forEach(order=>{

    if(order.products){

        order.products.forEach(item=>{

            if(!productSales[item.name]){

                productSales[item.name]={

                    qty:0,
                    revenue:0

                };

            }

            productSales[item.name].qty += item.qty;

            productSales[item.name].revenue +=
            item.qty * item.price;

        });

    }

});

let table =
document.getElementById("productTable");

table.innerHTML="";

Object.keys(productSales).forEach(name=>{

table.innerHTML += `

<tr>

<td>${name}</td>

<td>${productSales[name].qty}</td>

<td>₹${productSales[name].revenue}</td>

</tr>

`;

});

/* ===========================
   TOP CUSTOMERS
=========================== */

let customerData = {};

orders.forEach(order=>{

    if(!customerData[order.email]){

        customerData[order.email]={

            name:order.customerName,

            email:order.email,

            orders:0,

            spent:0

        };

    }

    customerData[order.email].orders++;

    customerData[order.email].spent +=
    Number(order.total||0);

});

let customerTable =
document.getElementById("customerTable");

customerTable.innerHTML="";

Object.values(customerData).forEach(customer=>{

customerTable.innerHTML += `

<tr>

<td>${customer.name}</td>

<td>${customer.email}</td>

<td>${customer.orders}</td>

<td>₹${customer.spent}</td>

</tr>

`;

});

/* ===========================
   RECENT TRANSACTIONS
=========================== */

let transactionTable =
document.getElementById("transactionTable");

transactionTable.innerHTML="";

orders.slice().reverse().forEach(order=>{

transactionTable.innerHTML += `

<tr>

<td>${order.orderId}</td>

<td>${order.customerName}</td>

<td>₹${order.total}</td>

<td>${order.status}</td>

</tr>

`;

});
/* ===========================
   SALES CHART
=========================== */

let monthlySales =
[0,0,0,0,0,0,0];

orders.forEach(order=>{

    let day =
    Math.floor(Math.random()*7);

    monthlySales[day]+=Number(order.total||0);

});

new Chart(

document.getElementById("salesChart"),

{

type:"bar",

data:{

labels:[
"Mon",
"Tue",
"Wed",
"Thu",
"Fri",
"Sat",
"Sun"
],

datasets:[{

label:"Revenue",

data:monthlySales,

backgroundColor:"#ff4d8d"

}]

},

options:{

responsive:true,

plugins:{

legend:{

display:false

}

}

}

}

);

function downloadReport(){

let report = `

========== AV Sweet House ==========

Total Revenue : ₹${revenue}

Total Orders : ${orders.length}

Total Customers : ${users.length}

Total Products : ${products.length}

====================================

`;

let blob = new Blob([report],{type:"text/plain"});

let link = document.createElement("a");

link.href = URL.createObjectURL(blob);

link.download = "Sales_Report.txt";

link.click();

}

</script>
</body>

</html>
