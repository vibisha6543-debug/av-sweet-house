<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products | AV Sweet House</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fff5f8;
}

/* HEADER */

.header{

background:linear-gradient(135deg,#ff4d8d,#ff9ec6);

padding:20px 40px;

display:flex;

justify-content:space-between;

align-items:center;

color:white;

}

.header h1{

font-size:32px;

font-weight:700;

}

.top-buttons{

display:flex;

gap:15px;

}

.btn{

text-decoration:none;

padding:12px 24px;

border-radius:30px;

font-weight:600;

transition:.3s;

}

.btn-add{

background:white;

color:#ff4d8d;

}

.btn-add:hover{

transform:translateY(-2px);

}

.btn-dashboard{

background:#ff2f78;

color:white;

}

.btn-dashboard:hover{

background:#e1005b;

}

/* CONTAINER */

.container{

padding:35px;

}

/* SEARCH */

.search-filter{

display:grid;

grid-template-columns:2fr 1fr;

gap:20px;

margin-bottom:35px;

}

.search-filter input,
.search-filter select{

padding:16px 20px;

border:2px solid #ffd1e1;

border-radius:18px;

font-size:17px;

outline:none;

background:white;

}

.search-filter input:focus,
.search-filter select:focus{

border-color:#ff4d8d;

}

/* GRID */

.products-grid{

display:grid;

grid-template-columns:repeat(auto-fill,minmax(300px,1fr));

gap:25px;

}

/* CARD */

.product-card{

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:0 8px 20px rgba(0,0,0,.08);

transition:.3s;

}

.product-card:hover{

transform:translateY(-6px);

}

.product-card img{

width:100%;

height:220px;

object-fit:cover;

display:block;

}

.content{

padding:20px;

}

.content h3{

font-size:24px;

margin-bottom:10px;

color:#222;

}

.price{

font-size:28px;

font-weight:700;

color:#ff4d8d;

margin-bottom:15px;

}

.category{

display:inline-block;

padding:8px 18px;

border-radius:30px;

background:#ffeaf2;

color:#ff4d8d;

font-size:14px;

margin-bottom:20px;

}

/* BUTTONS */

.action-btn{

width:100%;

padding:13px;

border:none;

border-radius:30px;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

margin-bottom:12px;

}

.edit-btn{

background:#4CAF50;

color:white;

}

.edit-btn:hover{

background:#3d9d41;

}

.delete-btn{

background:#ff4d8d;

color:white;

}

.delete-btn:hover{

background:#ff2f78;

}

/* EMPTY */

.empty{

display:none;

text-align:center;

padding:80px;

font-size:22px;

font-weight:600;

color:#888;

}

/* RESPONSIVE */

@media(max-width:900px){

.search-filter{

grid-template-columns:1fr;

}

.header{

flex-direction:column;

gap:15px;

}

}

</style>

</head>

<body>

<div class="header">

<h1>🍰 Manage Products</h1>

<div class="top-buttons">

<a href="add-product.html" class="btn btn-add">

+ Add Product

</a>

<a href="admin-dashboard.html" class="btn btn-dashboard">

Dashboard

</a>

</div>

</div>

<div class="container">

<div class="search-filter">

<input
type="text"
id="searchInput"
placeholder="🔍 Search Products..."
onkeyup="loadProducts()">

<select
id="categoryFilter"
onchange="loadProducts()">

<option value="All">All Categories</option>

<option value="Cakes">Cakes</option>

<option value="Birthday Cakes">Birthday Cakes</option>

<option value="Anniversary Cakes">Anniversary Cakes</option>
<option value="Occasion Cakes">Occasion Cakes</option>

<option value="Chocolate Cakes">Chocolate Cakes</option>

<option value="Wedding Cakes">Wedding Cakes</option>

<option value="Desserts">Desserts</option>

<option value="Chocolates">Chocolates</option>

<option value="Juices">Juices</option>

<option value="Decorations">Decorations</option>

</select>

</div>

<div
id="productsContainer"
class="products-grid">

</div>

<div
id="emptyMessage"
class="empty">

🍰 No Products Found

</div>

<script>
    /* ADMIN LOGIN CHECK */

if(localStorage.getItem("adminLoggedIn") !== "true"){

window.location.href="admin-login.html";

}

/* LOAD PRODUCTS */

let products = [];

let container=
document.getElementById("productsContainer");

let empty=
document.getElementById("emptyMessage");

/* LOAD PRODUCTS */

async function loadProducts(){

    container.innerHTML = "";

    const response = await fetch("http://localhost:5000/api/products");

    products = await response.json();

    let keyword =
    document.getElementById("searchInput").value.toLowerCase();

    let category =
    document.getElementById("categoryFilter").value;

    let filteredProducts =
    products.filter(product=>{

        let nameMatch =
        product.name.toLowerCase().includes(keyword);

        let categoryMatch =
        category==="All" || product.category===category;

        return nameMatch && categoryMatch;

    });

    if(filteredProducts.length===0){

        empty.style.display="block";

        return;

    }

    empty.style.display="none";

    filteredProducts.forEach(product=>{

        container.innerHTML += `

        <div class="product-card">

            <img src="${product.image}" alt="${product.name}">

            <div class="content">

                <h3>${product.name}</h3>

                <div class="price">
                ₹${product.price}
                </div>

                <div class="category">
                ${product.category}
                </div>

                <button
class="action-btn edit-btn"
onclick="editProduct(${product.id})">

✏ Edit Product

</button>

                <button
class="action-btn delete-btn"
onclick="deleteProduct(${product.id})">

🗑 Delete Product

</button>

            </div>

        </div>

        `;

    });

}

/* EDIT */

function editProduct(index){

localStorage.setItem(
"editProductIndex",
index
);

window.location.href="edit-product.html";

}

/* DELETE */

async function deleteProduct(id){

    let confirmDelete = confirm(
        "Are you sure you want to delete this product?"
    );

    if(!confirmDelete){
        return;
    }

    try{

        const response = await fetch(
            `http://localhost:5000/api/products/${id}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        alert(data.message);

        loadProducts();

    }
    catch(error){

        console.error(error);

        alert("Failed to delete product.");

    }

}
/* INITIAL LOAD */

loadProducts();

</script>

</body>

</html>
