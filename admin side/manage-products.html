<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products | AV Sweet House</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #fff5f8;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #ff4d8d, #ff9ec6);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(255, 77, 141, 0.2);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .back-btn {
            text-decoration: none;
            background: white;
            color: #ff4d8d;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .add-btn {
            background: white;
            color: #ff4d8d;
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .top-bar .left {
            display: flex;
            flex-direction: column;
        }

        .top-bar .left h2 {
            font-weight: 700;
            color: #333;
            font-size: 22px;
        }

        .top-bar .left p {
            color: #888;
            font-size: 14px;
        }

        .top-bar .right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .count-badge {
            background: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            color: #888;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 77, 141, 0.05);
            white-space: nowrap;
        }

        .count-badge span {
            color: #ff4d8d;
            font-weight: 700;
        }

        /* =========================
           SEARCH BAR
        ========================= */
        .search-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 4px 4px 4px 18px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border: 2px solid #f0e0e0;
            transition: all 0.3s ease;
            flex: 1;
            max-width: 400px;
            min-width: 200px;
        }

        .search-wrapper:focus-within {
            border-color: #ff4d8d;
            box-shadow: 0 0 0 4px rgba(255, 77, 141, 0.08);
        }

        .search-wrapper i {
            color: #aaa;
            font-size: 16px;
        }

        .search-wrapper input {
            border: none;
            background: transparent;
            outline: none;
            padding: 10px 0;
            font-size: 14px;
            color: #333;
            width: 100%;
        }

        .search-wrapper input::placeholder {
            color: #aaa;
        }

        .search-wrapper .clear-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 50%;
            font-size: 14px;
            transition: all 0.3s ease;
            display: none;
        }

        .search-wrapper .clear-btn:hover {
            color: #dc3545;
            background: #fde8e8;
        }

        .search-wrapper .search-btn {
            background: #ff4d8d;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-wrapper .search-btn:hover {
            background: #ff2f78;
            transform: scale(1.02);
        }

        /* =========================
           TABLE
        ========================= */
        .table-wrapper {
            background: white;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #fff5f8;
            color: #555;
            font-size: 13px;
            padding: 14px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #f2f2f2;
            font-size: 13px;
            vertical-align: middle;
        }

        td img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product-name {
            font-weight: 600;
            color: #333;
        }

        .product-category {
            font-size: 12px;
            color: #888;
            background: #f5f5f5;
            padding: 3px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .action-btn {
            border: none;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 2px;
        }

        .action-btn.edit {
            background: #dbeafe;
            color: #1e40af;
        }

        .action-btn.edit:hover {
            background: #1e40af;
            color: white;
        }

        .action-btn.delete {
            background: #fde8e8;
            color: #991b1b;
        }

        .action-btn.delete:hover {
            background: #991b1b;
            color: white;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .no-results i {
            font-size: 40px;
            color: #ddd;
            display: block;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff4d8d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 14px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: none;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.4s ease;
            max-width: 400px;
        }

        .toast.show {
            display: flex;
        }
        .toast.success { background: linear-gradient(135deg, #28a745, #20c997); }
        .toast.error { background: linear-gradient(135deg, #dc3545, #e74c3c); }

        @keyframes slideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .result-count {
            font-size: 13px;
            color: #888;
            padding: 5px 0;
        }

        .result-count strong {
            color: #ff4d8d;
        }

        /* Responsive */
        @media(max-width: 768px) {
            .header {
                padding: 15px 20px;
                flex-direction: column;
                text-align: center;
            }
            .header h1 { font-size: 22px; }
            .header-actions { justify-content: center; }
            .container { padding: 0 15px; }
            
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .top-bar .right {
                flex-direction: column;
                align-items: stretch;
            }
            .search-wrapper {
                max-width: 100%;
                min-width: auto;
            }
            .table-wrapper { padding: 15px; }
            th, td { padding: 10px 8px; font-size: 12px; }
            td img { width: 40px; height: 40px; }
            .toast { top: 15px; right: 15px; left: 15px; max-width: none; }
            .count-badge { text-align: center; }
        }

        @media(max-width: 480px) {
            .header h1 { font-size: 18px; }
            .top-bar .left h2 { font-size: 18px; }
            .search-wrapper { padding: 4px 4px 4px 12px; }
            .search-wrapper input { font-size: 12px; padding: 8px 0; }
            .search-wrapper .search-btn { padding: 8px 14px; font-size: 12px; }
            .action-btn { font-size: 10px; padding: 4px 10px; }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1><i class="fa-solid fa-cake-candles"></i> Manage Products</h1>
        <div class="header-actions">
            <a href="add-product.html" class="add-btn">
                <i class="fa-solid fa-plus"></i> Add Product
            </a>
            <a href="admin-dashboard.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
            </a>
        </div>
    </header>

    <div class="container">
        <div class="top-bar">
            <div class="left">
                <h2>📦 All Products</h2>
                <p>Manage your store products</p>
            </div>
            <div class="right">
                <!-- ===== SEARCH BAR ===== -->
                <div class="search-wrapper">
                    <i class="fa-solid fa-search"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search by name or category..."
                        oninput="searchProducts()"
                    >
                    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">
                        <i class="fa-solid fa-times"></i>
                    </button>
                    <button class="search-btn" onclick="searchProducts()">
                        Search
                    </button>
                </div>

                <div class="count-badge">
                    <i class="fa-regular fa-box"></i>
                    <span id="productCount">0</span> Products
                </div>
            </div>
        </div>

        <!-- Search Result Count -->
        <div class="result-count" id="resultCount" style="display:none;">
            Found <strong id="resultCountText">0</strong> product(s)
        </div>

        <div class="table-wrapper">
            <div id="loadingState" class="loading">
                <div class="spinner"></div>
                Loading products...
            </div>

            <div id="productsContainer" style="display:none;">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <script>
        if (localStorage.getItem("adminLoggedIn") !== "true") {
            window.location.href = "admin-login.html";
        }

        const API_URL = 'http://localhost:5000/api';
        let allProducts = [];

        // ============================================
        // TOAST NOTIFICATION
        // ============================================

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toast.className = 'toast show ' + type;
            toastMsg.textContent = message;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================
        // LOAD PRODUCTS FROM DATABASE
        // ============================================

        async function loadProducts() {
            const loading = document.getElementById('loadingState');
            const container = document.getElementById('productsContainer');
            const tbody = document.getElementById('productsBody');

            loading.style.display = 'block';
            container.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/products`);

                if (!response.ok) {
                    throw new Error('Failed to load products');
                }

                const products = await response.json();
                allProducts = Array.isArray(products) ? products : [];

                // Update count
                document.getElementById('productCount').textContent = allProducts.length;

                if (allProducts.length === 0) {
                    tbody.innerHTML = `
                            <tr>
                                <td colspan="5" class="text-center text-secondary py-4">
                                    <i class="fa-regular fa-box fa-2x d-block mb-2"></i>
                                    No products found. <a href="add-product.html" style="color:#ff4d8d;">Add your first product</a>
                                </td>
                            </tr>
                        `;
                } else {
                    renderProducts(allProducts);
                }

                loading.style.display = 'none';
                container.style.display = 'block';

            } catch (error) {
                console.error('Load Products Error:', error);
                loading.innerHTML = `
                        <div style="color:#dc3545;">
                            <i class="fa-solid fa-circle-exclamation fa-2x d-block mb-3"></i>
                            ❌ Failed to load products
                            <br><br>
                            <span style="font-size:14px;color:#666;">Error: ${error.message}</span>
                            <br><br>
                            <button onclick="loadProducts()" style="padding:10px 25px;border:none;border-radius:20px;background:#ff4d8d;color:white;cursor:pointer;">
                                <i class="fa-solid fa-sync"></i> Retry
                            </button>
                        </div>
                    `;
                loading.style.display = 'block';
            }
        }

        // ============================================
        // RENDER PRODUCTS
        // ============================================

        function renderProducts(products) {
            const tbody = document.getElementById('productsBody');

            if (products.length === 0) {
                tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center text-secondary py-4">
                                <i class="fa-regular fa-box fa-2x d-block mb-2"></i>
                                No products found
                            </td>
                        </tr>
                    `;
                document.getElementById('resultCount').style.display = 'none';
                return;
            }

            tbody.innerHTML = products.map(p => `
                    <tr>
                        <td>
                            <img src="${p.image || 'https://via.placeholder.com/50x50/ff4d8d/ffffff?text=Product'}" 
                                 alt="${p.name}"
                                 onerror="this.src='https://via.placeholder.com/50x50/ff4d8d/ffffff?text=Product'">
                        </td>
                        <td>
                            <div class="product-name">${p.name}</div>
                            <div style="font-size:11px;color:#aaa;">ID: ${p._id ? p._id.slice(-8) : 'N/A'}</div>
                        </td>
                        <td>
                            <span class="product-category">${p.category || 'Uncategorized'}</span>
                        </td>
                        <td><strong>₹${Number(p.price || 0).toFixed(0)}</strong></td>
                        <td>
                            <button class="action-btn edit" onclick="editProduct('${p._id}')">
                                <i class="fa-regular fa-pen-to-square"></i> Edit
                            </button>
                            <button class="action-btn delete" onclick="deleteProduct('${p._id}')">
                                <i class="fa-regular fa-trash-can"></i> Delete
                            </button>
                        </td>
                    </tr>
                `).join('');

            // Update result count
            const resultCount = document.getElementById('resultCount');
            const resultText = document.getElementById('resultCountText');
            if (products.length !== allProducts.length) {
                resultCount.style.display = 'block';
                resultText.textContent = products.length;
            } else {
                resultCount.style.display = 'none';
            }
        }

        // ============================================
        // SEARCH PRODUCTS
        // ============================================

        function searchProducts() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const clearBtn = document.getElementById('clearBtn');

            // Show/hide clear button
            if (query.length > 0) {
                clearBtn.style.display = 'block';
            } else {
                clearBtn.style.display = 'none';
            }

            if (query === '') {
                renderProducts(allProducts);
                return;
            }

            const filtered = allProducts.filter(product => {
                const nameMatch = product.name && product.name.toLowerCase().includes(query);
                const categoryMatch = product.category && product.category.toLowerCase().includes(query);
                return nameMatch || categoryMatch;
            });

            renderProducts(filtered);
        }

        // ============================================
        // CLEAR SEARCH
        // ============================================

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearBtn').style.display = 'none';
            renderProducts(allProducts);
            document.getElementById('searchInput').focus();
        }

        // ============================================
        // DELETE PRODUCT
        // ============================================

        async function deleteProduct(productId) {
            if (!productId) {
                showToast('❌ Invalid product ID', 'error');
                return;
            }

            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                const response = await fetch(`${API_URL}/products/${productId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showToast('✅ Product deleted successfully!', 'success');
                    loadProducts(); // Refresh list
                } else {
                    const data = await response.json();
                    showToast('❌ ' + (data.message || 'Failed to delete product'), 'error');
                }
            } catch (error) {
                console.error('Delete Error:', error);
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ============================================
        // EDIT PRODUCT
        // ============================================

        function editProduct(productId) {
            if (!productId) {
                showToast('❌ Invalid product ID', 'error');
                return;
            }
            localStorage.setItem('editProductId', productId);
            window.location.href = 'edit-product.html';
        }

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================

        document.addEventListener('keydown', function(e) {
            // Ctrl+F to focus search
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
            // Escape to clear search
            if (e.key === 'Escape') {
                const searchInput = document.getElementById('searchInput');
                if (document.activeElement === searchInput) {
                    clearSearch();
                    searchInput.blur();
                }
            }
        });

        // ============================================
        // LOAD ON PAGE LOAD
        // ============================================

        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            console.log('✅ Manage Products page loaded with search');
        });
    </script>

</body>
</html>
