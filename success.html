<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Success - AV Sweet House</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fff0f6, #fff7fb);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 500px;
      padding: 40px 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0.7);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .check {
      font-size: 80px;
      color: #28a745;
      margin-bottom: 15px;
    }

    h1 {
      color: #d63384;
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .order-id {
      background: #fff0f6;
      padding: 10px;
      border-radius: 10px;
      color: #d63384;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      background: #d63384;
      color: white;
      padding: 12px 25px;
      border-radius: 30px;
      text-decoration: none;
      transition: 0.3s;
      margin: 5px;
    }

    .btn:hover {
      background: #b91c68;
    }

    .outline {
      background: transparent;
      border: 2px solid #d63384;
      color: #d63384;
    }

    .outline:hover {
      background: #d63384;
      color: white;
    }

    .note {
      margin-top: 15px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="check">✔</div>

    <h1>Order Placed Successfully!</h1>

    <p>
      Thank you for ordering from <b>AV Sweet House</b> 🍰<br>
      Your delicious treats are being prepared with love ❤️
    </p>

    <div class="order-id">
      Order ID: AVS#2026001
    </div>

    <a href="index.html" class="btn">Back to Home</a>
    <a href="cart.html" class="btn outline">View Order</a>

    <div class="note">
      You will receive confirmation on your phone shortly 📱
    </div>

  </div>

</body>

</html>
